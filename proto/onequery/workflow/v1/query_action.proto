    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
}

message QueryActionQueryColumn {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  QueryActionQueryLogicalType logical_type = 2 [(buf.validate.field).enum.defined_only = true];
}

message QueryActionQueryRow {
  repeated string display_values = 1 [
    (buf.validate.field).repeated.max_items = 512,
    (buf.validate.field).repeated.items.string.max_len = 8000
  ];
}

enum QueryActionMode {
  QUERY_ACTION_MODE_UNSPECIFIED = 0;
  QUERY_ACTION_MODE_VALIDATE = 1;
  QUERY_ACTION_MODE_EXECUTE = 2;
}

enum QueryActionQueryLogicalType {
  QUERY_ACTION_QUERY_LOGICAL_TYPE_UNSPECIFIED = 0;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_STRING = 1;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_NUMBER = 2;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_BOOLEAN = 3;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_BIGINT = 4;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_DATETIME = 5;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_ARRAY = 6;
  QUERY_ACTION_QUERY_LOGICAL_TYPE_JSON = 7;
}
