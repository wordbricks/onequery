message QueryActionRecordQueryExecutionResult {
  QueryActionQuerySourceRecord source = 1 [(buf.validate.field).required = true];
  uint32 row_count = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 1000
  ];
  google.protobuf.Duration elapsed = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  repeated QueryActionQueryColumn columns = 4 [(buf.validate.field).repeated.max_items = 512];
  repeated QueryActionQueryRow rows = 5 [(buf.validate.field).repeated.max_items = 100];
  bool truncated = 6 [(buf.validate.field).required = true];
}

message QueryActionQuerySourceRecord {
  string display_name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "\\S"
  ];
  string source_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  WorkflowSourceProvider provider = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  string source_key = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
