// Internal durable payloads for the query action workflow.
edition = "2023";

package onequery.workflow.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "onequery/workflow/v1/common.proto";

message QueryActionCommandPayload {
  oneof command {
    option (buf.validate.oneof).required = true;

    QueryActionStartValidateCommand start_validate = 1;
    QueryActionStartExecuteCommand start_execute = 2;
    QueryActionRecordSourceFoundCommand record_source_found = 3;
    QueryActionRecordSourceNotFoundCommand record_source_not_found = 4;
    QueryActionRecordSourceNotQueryableCommand record_source_not_queryable = 5;
    QueryActionRecordQueryValidationAcceptedCommand record_query_validation_accepted = 6;
    QueryActionRecordQueryValidationRejectedCommand record_query_validation_rejected = 7;
    QueryActionRecordQueryValidationPreparationFailedCommand record_query_validation_preparation_failed = 8;
    QueryActionRecordCredentialsLoadedCommand record_credentials_loaded = 9;
    QueryActionRecordCredentialsPreparationFailedCommand record_credentials_preparation_failed = 10;
    QueryActionRecordQueryExecutionSucceededCommand record_query_execution_succeeded = 11;
    QueryActionRecordQueryExecutionUnavailableCommand record_query_execution_unavailable = 12;
    QueryActionRecordQueryExecutionTimedOutCommand record_query_execution_timed_out = 13;
    QueryActionRecordQueryExecutionFailedCommand record_query_execution_failed = 14;
    QueryActionRecordUsagePersistenceSucceededCommand record_usage_persistence_succeeded = 15;
    QueryActionRecordUsagePersistenceFailedCommand record_usage_persistence_failed = 16;
  }
}

message QueryActionEventPayload {
  oneof event {
    option (buf.validate.oneof).required = true;

    QueryActionReceivedEvent action_received = 1;
    QueryActionSourceLoadedEvent source_loaded = 2;
    QueryActionSourceNotFoundEvent source_not_found = 3;
    QueryActionSourceNotQueryableEvent source_not_queryable = 4;
    QueryActionQueryValidatedEvent query_validated = 5;
    QueryActionQueryRejectedEvent query_rejected = 6;
    QueryActionCredentialsLoadedEvent credentials_loaded = 7;
    QueryActionQueryPreparationFailedEvent query_preparation_failed = 8;
    QueryActionQueryExecutedEvent query_executed = 9;
    QueryActionQueryUnavailableEvent query_unavailable = 10;
    QueryActionQueryTimedOutEvent query_timed_out = 11;
    QueryActionQueryExecutionFailedEvent query_execution_failed = 12;
    QueryActionUsagePersistedEvent usage_persisted = 13;
    QueryActionUsagePersistFailedEvent usage_persist_failed = 14;
  }
}

message QueryActionEffectPayload {
  oneof effect {
    option (buf.validate.oneof).required = true;

    QueryActionLoadSourceEffect load_source = 1;
    QueryActionValidateQueryEffect validate_query = 2;
    QueryActionLoadCredentialsEffect load_credentials = 3;
    QueryActionExecuteQueryEffect execute_query = 4;
    QueryActionPersistUsageEffect persist_usage = 5;
  }
}

message QueryActionStartValidateCommand {
  string query_text = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 262144,
    (buf.validate.field).string.pattern = "\\S"
  ];
  string source_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
}

message QueryActionStartExecuteCommand {
  string query_text = 1 [
