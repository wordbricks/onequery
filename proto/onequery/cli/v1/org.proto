// Organization lookup and listing messages for the CLI API.
edition = "2023";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "onequery/cli/v1/common.proto";

message ListOrganizationsRequest {
  CliPageRequest page = 1;
}

message ListOrganizationsResponse {
  repeated CliOrganizationSummary organizations = 1 [(buf.validate.field).repeated.max_items = 100];
  CliPage page = 2 [(buf.validate.field).required = true];
}

message GetOrganizationRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
}

message GetOrganizationResponse {
  string slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  repeated OrganizationRole roles = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.items.enum.not_in = 0,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  repeated OrgCapability capabilities = 4 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.items.enum.not_in = 0,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
}

message CliOrganizationSummary {
  string slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
}

enum OrgCapability {
  ORG_CAPABILITY_UNSPECIFIED = 0;
  ORG_CAPABILITY_ORG_LIST = 1;
  ORG_CAPABILITY_ORG_READ = 2;
  ORG_CAPABILITY_SOURCE_CONNECT = 3;
  ORG_CAPABILITY_SOURCE_LIST = 4;
  ORG_CAPABILITY_SOURCE_READ = 5;
  ORG_CAPABILITY_QUERY_EXECUTE = 6;
  ORG_CAPABILITY_SOURCE_API_DESCRIBE = 7;
  ORG_CAPABILITY_SOURCE_API_EXECUTE = 8;
  ORG_CAPABILITY_SOURCE_WRITE = 9;
}

enum OrganizationRole {
  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_OWNER = 1;
  ORGANIZATION_ROLE_ADMIN = 2;
  ORGANIZATION_ROLE_MEMBER = 3;
}
