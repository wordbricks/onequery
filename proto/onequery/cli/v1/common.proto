syntax = "proto3";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "google/rpc/error_details.proto";

message CliPage {
  optional string next_cursor = 1 [(buf.validate.field).string.min_len = 1];
  uint64 returned_count = 2;
}

message CliSanitization {
  string profile = 1 [(buf.validate.field).string.min_len = 1];
  repeated string sanitized_paths = 2;
  bool raw_available = 3;
}

enum CliContentFormat {
  CLI_CONTENT_FORMAT_UNSPECIFIED = 0;
  CLI_CONTENT_FORMAT_MARKDOWN = 1;
}

enum CliProblemCode {
  CLI_PROBLEM_CODE_UNSPECIFIED = 0;
  CLI_PROBLEM_CODE_FORBIDDEN = 1;
  CLI_PROBLEM_CODE_INVALID_REQUEST = 2;
  CLI_PROBLEM_CODE_LOGIN_DENIED = 3;
  CLI_PROBLEM_CODE_LOGIN_RATE_LIMITED = 4;
  CLI_PROBLEM_CODE_LOGIN_SESSION_EXPIRED = 5;
  CLI_PROBLEM_CODE_MALFORMED_JSON = 6;
  CLI_PROBLEM_CODE_NOT_LOGGED_IN = 7;
  CLI_PROBLEM_CODE_ORG_NOT_FOUND = 8;
  CLI_PROBLEM_CODE_QUERY_EXECUTION_FAILED = 9;
  CLI_PROBLEM_CODE_QUERY_EXECUTION_TIMED_OUT = 10;
  CLI_PROBLEM_CODE_QUERY_EXECUTION_UNAVAILABLE = 11;
  CLI_PROBLEM_CODE_QUERY_PREPARATION_FAILED = 12;
  CLI_PROBLEM_CODE_QUERY_REJECTED = 13;
  CLI_PROBLEM_CODE_SOURCE_API_DESCRIBE_FAILED = 14;
  CLI_PROBLEM_CODE_SOURCE_API_EXECUTION_FAILED = 15;
  CLI_PROBLEM_CODE_SOURCE_API_FORBIDDEN = 16;
  CLI_PROBLEM_CODE_SOURCE_API_PREPARATION_FAILED = 17;
  CLI_PROBLEM_CODE_SOURCE_API_EXECUTION_STATE_INVALID = 18;
  CLI_PROBLEM_CODE_SOURCE_API_SOURCE_UNAVAILABLE = 19;
  CLI_PROBLEM_CODE_SOURCE_NOT_FOUND = 20;
  CLI_PROBLEM_CODE_SOURCE_NAME_CONFLICT = 21;
  CLI_PROBLEM_CODE_SOURCE_NOT_QUERYABLE = 22;
}

enum CliProblemStage {
  CLI_PROBLEM_STAGE_UNSPECIFIED = 0;
  CLI_PROBLEM_STAGE_AUTH = 1;
  CLI_PROBLEM_STAGE_EXECUTE_QUERY = 2;
  CLI_PROBLEM_STAGE_READ_QUERY_INPUT = 3;
  CLI_PROBLEM_STAGE_RESOLVE_ORG = 4;
  CLI_PROBLEM_STAGE_RESOLVE_SOURCE = 5;
}

message CliErrorDetail {
  CliProblemCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  CliProblemStage stage = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string title = 3 [(buf.validate.field).string.min_len = 1];
  optional string hint = 4 [(buf.validate.field).string.min_len = 1];
  bool retryable = 5;
  optional string request_id = 6 [(buf.validate.field).string.min_len = 1];
}

// Comment: this message exists to keep generated Connect error-detail schemas
// available to both the CLI server and the Rust CLI Connect client.
message CliConnectErrorDetailReference {
  oneof detail {
    option (buf.validate.oneof).required = true;

    CliErrorDetail cli_error = 1;
    google.rpc.BadRequest bad_request = 2;
    google.rpc.RetryInfo retry_info = 3;
  }
}
