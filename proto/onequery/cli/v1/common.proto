// Common CLI API types shared by the OneQuery Connect contract.
edition = "2023";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "google/rpc/error_details.proto";

message CliPage {
  string next_cursor = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
  uint32 returned_count = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 1000
  ];
}

// Request pagination lives in a dedicated message so generated clients preserve
// the "page omitted" vs "page present" boundary across language runtimes.
message CliPageRequest {
  uint32 limit = 1 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  string cursor = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4096
  ];
}

message CliSanitization {
  string profile = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  repeated string sanitized_paths = 2 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 512
  ];
  bool raw_available = 3;
}

enum ContentFormat {
  CONTENT_FORMAT_UNSPECIFIED = 0;
  CONTENT_FORMAT_MARKDOWN = 1;
}

// Codegen anchor for standard Connect error-detail schemas used by the CLI
// server and the Rust CLI client. Typed OneQuery CLI problems are identified by
// google.rpc.ErrorInfo with domain "onequery.cli.v1".
message CliConnectErrorDetailReference {
  oneof detail {
    option (buf.validate.oneof).required = true;

    google.rpc.ErrorInfo error_info = 1;
    google.rpc.BadRequest bad_request = 2;
    google.rpc.RetryInfo retry_info = 3;
    google.rpc.ResourceInfo resource_info = 4;
    google.rpc.PreconditionFailure precondition_failure = 5;
    google.rpc.QuotaFailure quota_failure = 6;
    google.rpc.Help help = 7;
  }
}
