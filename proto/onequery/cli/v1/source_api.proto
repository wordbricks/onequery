syntax = "proto3";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "onequery/cli/v1/source.proto";

message DescribeSourceApiRequest {
  string org_slug = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
}

message DescribeSourceApiResponse {
  CliSourceApiSource source = 1 [(buf.validate.field).required = true];
  string descriptor_version = 2 [(buf.validate.field).string.min_len = 1];
  optional string default_path_operation = 3 [(buf.validate.field).string.min_len = 1];
  repeated CliSourceApiOperation operations = 4;
  repeated CliSourceApiExample examples = 5;
  repeated string notes = 6;
}

message SourceApiDraft {
  string org_slug = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  string operation = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  optional string selector = 4 [(buf.validate.field).string.min_len = 1];
  optional string method_override = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Z]+$"
  ];
  repeated CliSourceApiHeader headers = 6;
  optional google.protobuf.Struct field_patch = 7;
  oneof body {
    google.protobuf.Value json_body = 8;
    string text_body = 9;
    bytes binary_body = 10;
  }
}

message SourceApiPreview {
  string source_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  CliSourceProvider provider = 2 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  string operation = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  optional string selector = 4 [(buf.validate.field).string.min_len = 1];
  CliSourceApiOperationKind kind = 5 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  optional string method = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Z]+$"
  ];
  optional string host = 7 [(buf.validate.field).string.min_len = 1];
  optional string url = 8 [(buf.validate.field).string.min_len = 1];
  repeated string header_names = 9 [
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9-]+$"
  ];
  CliSourceApiBodyKind body_kind = 10 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  repeated string body_paths = 11 [(buf.validate.field).repeated.items.string.min_len = 1];
  CliSourceApiPaginationPolicy pagination_policy = 12 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
}

message StartSourceApiExecution {
  SourceApiDraft draft = 1 [(buf.validate.field).required = true];
  CliSourceApiExecuteMode mode = 2 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
}

message ResumeSourceApiExecution {
  string org_slug = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  string continuation_token = 3 [(buf.validate.field).string.min_len = 1];
}

message ExecuteSourceApiRequest {
  oneof input {
    option (buf.validate.oneof).required = true;

    StartSourceApiExecution start = 1;
    ResumeSourceApiExecution resume = 2;
  }
}

message SourceApiExecutionResult {
  CliSourceApiSource source = 1 [(buf.validate.field).required = true];
  string operation = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  optional string selector = 3 [(buf.validate.field).string.min_len = 1];
  uint32 status = 4;
  repeated CliSourceApiHeader headers = 5;
  string content_type = 6 [(buf.validate.field).string.min_len = 1];
  oneof body {
    google.protobuf.Value json = 7;
    string text = 8;
    bytes binary = 9;
  }
  reserved 10;
  reserved "request_id";
}

message ExecuteSourceApiResponse {
  SourceApiPreview preview = 1 [(buf.validate.field).required = true];
  SourceApiExecutionResult result = 2;
  optional string continuation_token = 3 [(buf.validate.field).string.min_len = 1];
}

message CliSourceApiSource {
  string source_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  CliSourceProvider provider = 2 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  optional string display_name = 3 [(buf.validate.field).string.min_len = 1];
}

message CliSourceApiOperation {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  CliSourceApiOperationKind kind = 2 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  string summary = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4 [(buf.validate.field).string.min_len = 1];
  CliSourceApiSelectorKind selector_kind = 5 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  optional string selector_label = 6 [(buf.validate.field).string.min_len = 1];
  CliSourceApiMethodPolicy method_policy = 7 [(buf.validate.field).required = true];
  CliSourceApiFieldPolicy field_policy = 8 [(buf.validate.field).required = true];
  CliSourceApiHeaderPolicy header_policy = 9 [(buf.validate.field).required = true];
  CliSourceApiPaginationPolicy pagination_policy = 10 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  repeated CliSourceApiExample examples = 11;
  repeated string notes = 12 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message CliSourceApiMethodPolicy {
  optional string default_method = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Z]+$"
  ];
  repeated string allowed_methods = 2 [
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Z]+$"
  ];
}

message CliSourceApiFieldPolicy {
  bool supports_raw_fields = 1;
  bool supports_typed_fields = 2;
  bool supports_nested_paths = 3;
  bool supports_array_paths = 4;
  bool accepts_input = 5;
  CliSourceApiInputMode input_mode = 6;
  bool merge_patches = 7;
}

enum CliSourceApiInputMode {
  CLI_SOURCE_API_INPUT_MODE_UNSPECIFIED = 0;
  CLI_SOURCE_API_INPUT_MODE_NONE = 1;
  CLI_SOURCE_API_INPUT_MODE_REQUEST_OBJECT = 2;
  CLI_SOURCE_API_INPUT_MODE_REQUEST_BODY = 3;
}

message CliSourceApiHeaderPolicy {
  repeated string allowed_names = 1 [
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9-]+$"
  ];
}

message CliSourceApiExample {
  string label = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2 [(buf.validate.field).string.min_len = 1];
  string command = 3 [(buf.validate.field).string.min_len = 1];
}

message CliSourceApiHeader {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string value = 2;
}

enum CliSourceApiOperationKind {
  CLI_SOURCE_API_OPERATION_KIND_UNSPECIFIED = 0;
  CLI_SOURCE_API_OPERATION_KIND_HTTP_REQUEST = 1;
  CLI_SOURCE_API_OPERATION_KIND_STRUCTURED_REQUEST = 2;
}

enum CliSourceApiSelectorKind {
  CLI_SOURCE_API_SELECTOR_KIND_UNSPECIFIED = 0;
  CLI_SOURCE_API_SELECTOR_KIND_NONE = 1;
  CLI_SOURCE_API_SELECTOR_KIND_PATH = 2;
  CLI_SOURCE_API_SELECTOR_KIND_IDENTIFIER = 3;
}

enum CliSourceApiPaginationPolicy {
  CLI_SOURCE_API_PAGINATION_POLICY_UNSPECIFIED = 0;
  CLI_SOURCE_API_PAGINATION_POLICY_NONE = 1;
  CLI_SOURCE_API_PAGINATION_POLICY_CONTINUATION_TOKEN = 2;
}

enum CliSourceApiExecuteMode {
  CLI_SOURCE_API_EXECUTE_MODE_UNSPECIFIED = 0;
  CLI_SOURCE_API_EXECUTE_MODE_EXECUTE = 1;
  CLI_SOURCE_API_EXECUTE_MODE_PREVIEW_ONLY = 2;
}

enum CliSourceApiBodyKind {
  CLI_SOURCE_API_BODY_KIND_UNSPECIFIED = 0;
  CLI_SOURCE_API_BODY_KIND_NONE = 1;
  CLI_SOURCE_API_BODY_KIND_JSON = 2;
  CLI_SOURCE_API_BODY_KIND_TEXT = 3;
  CLI_SOURCE_API_BODY_KIND_BINARY = 4;
}
