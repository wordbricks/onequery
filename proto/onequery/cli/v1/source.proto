// Source metadata, testing, and connection messages for the CLI API.
edition = "2023";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "onequery/cli/v1/common.proto";

message ListSourcesRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  CliPageRequest page = 2;
}

message ListSourcesResponse {
  repeated CliSource sources = 1 [(buf.validate.field).repeated.max_items = 100];
  CliPage page = 2 [(buf.validate.field).required = true];
}

message ListSourceProvidersRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
}

message ListSourceProvidersResponse {
  repeated CliSourceProvider providers = 1 [(buf.validate.field).repeated.max_items = 100];
}

message CliSourceProvider {
  string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  string label = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "\\S"
  ];
  bool connectable = 3;
  bool testable = 4;
  repeated SourceInterface interfaces = 5 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 2,
    (buf.validate.field).repeated.items.enum.not_in = 0,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  string credential_type = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  google.protobuf.Struct credential_example = 7 [(buf.validate.field).ignore = IGNORE_ALWAYS];
}

message GetSourceRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
}

message CliSource {
  string source_key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  string display_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "\\S"
  ];
  string provider = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  repeated SourceInterface interfaces = 4 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 2,
    (buf.validate.field).repeated.items.enum.not_in = 0,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];
  SourceStatus status = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
}

message GetSourceResponse {
  CliSource source = 1 [(buf.validate.field).required = true];
}

message TestSourceRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
}

message TestSourceResponse {
  CliSource source = 1 [(buf.validate.field).required = true];
  oneof outcome {
    option (buf.validate.oneof).required = true;

    TestSourceSupportedOutcome supported = 2;
    TestSourceUnsupportedOutcome unsupported = 3;
  }
}

message TestSourceSupportedOutcome {
  oneof result {
    option (buf.validate.oneof).required = true;

    TestSourcePassedOutcome passed = 1;
    TestSourceFailedOutcome failed = 2;
  }
  google.protobuf.Duration latency = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
}

message TestSourcePassedOutcome {
  string message = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message TestSourceFailedOutcome {
  string message = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  string error = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048,
    (buf.validate.field).string.pattern = "\\S"
  ];
}

message TestSourceUnsupportedOutcome {
  SourceTestUnsupportedReason reason = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  string message = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message GetSourceConnectGuideRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string provider = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
}

message GetSourceConnectGuideResponse {
  string title = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 160
  ];
  string description = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024
  ];
  ContentFormat format = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  string content = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 65536
  ];
  string command = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 8192
  ];
}

message ConnectSourceRequest {
  string org_slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  string source_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
  ];
  string provider = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"
  ];
  google.protobuf.Struct credentials = 4 [
    (buf.validate.field).ignore = IGNORE_ALWAYS
  ];
}

message ConnectSourceResponse {
  CliSource source = 1 [(buf.validate.field).required = true];
  string next_command = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 8192
  ];
}

enum SourceStatus {
  SOURCE_STATUS_UNSPECIFIED = 0;
  SOURCE_STATUS_ACTIVE = 1;
  SOURCE_STATUS_ERROR = 2;
  SOURCE_STATUS_DISCONNECTED = 3;
}

enum SourceInterface {
  SOURCE_INTERFACE_UNSPECIFIED = 0;
  SOURCE_INTERFACE_QUERY = 1;
  SOURCE_INTERFACE_API = 2;
}

enum SourceTestUnsupportedReason {
  SOURCE_TEST_UNSUPPORTED_REASON_UNSPECIFIED = 0;
  SOURCE_TEST_UNSUPPORTED_REASON_OAUTH = 1;
  SOURCE_TEST_UNSUPPORTED_REASON_NOT_IMPLEMENTED = 2;
}
