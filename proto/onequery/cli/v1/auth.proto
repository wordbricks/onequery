edition = "2023";

package onequery.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message GetSessionRequest {}

message GetSessionResponse {
  AuthMode auth_mode = 1 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  CliAuthUser user = 2 [(buf.validate.field).required = true];
  string active_org_slug = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RefreshSessionRequest {}

message RefreshSessionResponse {
  string access_token = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "\\S"
  ];
  AuthMode auth_mode = 2 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  CliAuthUser user = 3 [(buf.validate.field).required = true];
  string active_org_slug = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message StartDeviceAuthorizationRequest {}

message StartDeviceAuthorizationResponse {
  string state = 1 [(buf.validate.field).string.min_len = 1];
  string device_code = 2 [(buf.validate.field).string.min_len = 1];
  string user_code = 3 [(buf.validate.field).string.min_len = 1];
  string verification_url = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.uri = true
  ];
  string verification_complete_url = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.uri = true
  ];
  uint32 poll_after_ms = 6 [(buf.validate.field).uint32.gte = 1];
  google.protobuf.Timestamp expires_at = 7 [(buf.validate.field).required = true];
}

message PollDeviceAuthorizationRequest {
  string device_code = 1 [(buf.validate.field).string.min_len = 1];
}

message PollDeviceAuthorizationResponse {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    CliPendingDeviceAuthorization pending = 1;
    CliAuthorizedDeviceAuthorization authorized = 2;
  }
}

message CliAuthUser {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.email = true
  ];
  string display_name = 3 [(buf.validate.field).string.min_len = 1];
}

message CliPendingDeviceAuthorization {
  string state = 1 [(buf.validate.field).string.min_len = 1];
  uint32 poll_after_ms = 2 [(buf.validate.field).uint32.gte = 1];
}

message CliAuthorizedDeviceAuthorization {
  string state = 1 [(buf.validate.field).string.min_len = 1];
  string access_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "\\S"
  ];
  AuthMode auth_mode = 3 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).enum.defined_only = true
  ];
  CliAuthUser user = 4 [(buf.validate.field).required = true];
  string active_org_slug = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  ];
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

enum AuthMode {
  AUTH_MODE_UNSPECIFIED = 0;
  AUTH_MODE_BROWSER_SESSION = 1;
  AUTH_MODE_BEARER_TOKEN = 2;
}
