edition = "2023";

package onequery.landing.v1;

import "buf/validate/validate.proto";

service LandingService {
  rpc SubscribeProductUpdates(SubscribeProductUpdatesRequest) returns (SubscribeProductUpdatesResponse);
  rpc SubmitContact(SubmitContactRequest) returns (SubmitContactResponse);
}

message SubscribeProductUpdatesRequest {
  string email = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 320,
    (buf.validate.field).string.email = true
  ];
}

message SubscribeProductUpdatesResponse {
  string email = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.email = true
  ];
}

message SubmitContactRequest {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 200
  ];
  string email = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 320,
    (buf.validate.field).string.email = true
  ];
  string message = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 4000
  ];
}

message SubmitContactResponse {}
