version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: apps/cli/crates/proto-runtime/src/generated/proto
    include_imports: true
    exclude_types:
      - buf.validate
    opt:
      - views=true
      - json=true
  - local: protoc-gen-buffa-packaging
    out: apps/cli/crates/proto-runtime/src/generated/proto
    include_imports: true
    exclude_types:
      - buf.validate
    strategy: all
  - local: protoc-gen-connect-rust
    out: apps/cli/crates/proto-runtime/src/generated/connect
    opt:
      - buffa_module=crate::proto
  - local: protoc-gen-buffa-packaging
    out: apps/cli/crates/proto-runtime/src/generated/connect
    include_imports: true
    exclude_types:
      - buf.validate
    strategy: all
    opt:
      - filter=services
