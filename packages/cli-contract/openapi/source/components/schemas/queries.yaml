components:
  schemas:
    CliDeclaredQueryResultWindow:
      type: object
      properties:
        maxRows:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        maxBytes:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        cellMaxChars:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        timeoutMs:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
      additionalProperties: false
    CliQueryCanonicalRequest:
      type: object
      properties:
        sql:
          type: string
          minLength: 1
        parameters:
          type: array
          items:
            "$ref": "#/components/schemas/CliQueryParameter"
        maxRows:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        maxBytes:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        cellMaxChars:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
        timeoutMs:
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
      additionalProperties: false
    CliQueryParameter:
      type: object
      properties:
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - "null"
        value:
          description: Positional parameter value encoded as a string.
          nullable: true
          type: string
      required:
        - type
        - value
      additionalProperties: false
    CliQueryColumn:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        logicalType:
          type: string
          enum:
            - string
            - number
            - boolean
            - bigint
            - datetime
            - array
            - json
          nullable: true
      additionalProperties: false
    CliQueryExecuteEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliQuerySuccess"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
        page:
          "$ref": "./common.yaml#/components/schemas/CliPage"
        untrustedPaths:
          type: array
          items:
            type: string
            minLength: 1
        sanitization:
          "$ref": "./common.yaml#/components/schemas/CliSanitization"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliQueryRequest:
      type: object
      properties:
        sql:
          type: string
          minLength: 1
        parameters:
          type: array
          items:
            "$ref": "#/components/schemas/CliQueryParameter"
        maxRows:
          type: integer
          minimum: 1
          maximum: 1000
        maxBytes:
          type: integer
          minimum: 1
          maximum: 4194304
        cellMaxChars:
          type: integer
          minimum: 1
          maximum: 8000
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 120000
      required:
        - sql
      additionalProperties: false
    CliQuerySuccess:
      type: object
      properties:
        source:
          "$ref": "./sources.yaml#/components/schemas/CliSourceSummary"
        rowCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        elapsedMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        columns:
          type: array
          items:
            "$ref": "#/components/schemas/CliQueryColumn"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        truncated:
          type: boolean
      additionalProperties: false
    CliQueryValidateEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliQueryValidateResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliQueryValidateResponse:
      type: object
      properties:
        request:
          "$ref": "#/components/schemas/CliQueryCanonicalRequest"
        normalizedSql:
          type: string
          minLength: 1
        declaredResultWindow:
          "$ref": "#/components/schemas/CliDeclaredQueryResultWindow"
        source:
          "$ref": "./sources.yaml#/components/schemas/CliSourceSummary"
        truncated:
          type: boolean
      additionalProperties: false
