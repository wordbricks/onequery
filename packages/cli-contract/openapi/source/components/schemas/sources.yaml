components:
  schemas:
    CliSourceListEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliSourceListResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
        page:
          "$ref": "./common.yaml#/components/schemas/CliPage"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliSourceListResponse:
      type: object
      properties:
        sources:
          type: array
          items:
            "$ref": "#/components/schemas/CliSourceSummary"
      required:
        - sources
      additionalProperties: false
    CliSourceShowEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliSourceSummary"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliSourceConnectGuideEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliSourceConnectGuide"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliSourceConnectEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliSourceConnectResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliSourceProvider:
      type: string
      # Comment: CLI source providers mirror persisted provider identities, so
      # the contract must keep `supabase` alongside first-party Postgres.
      enum:
        - postgres
        - supabase
        - mysql
        - mongodb
        - bigquery
        - laminar
        - aws_athena_connector
        - ga
        - amplitude
        - mixpanel
        - posthog
        - sentry
        - github
        - linear
    CliSourceSummary:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
          nullable: true
        provider:
          "$ref": "#/components/schemas/CliSourceProvider"
        queryable:
          type: boolean
        status:
          type: string
          enum:
            - active
            - error
            - disconnected
      additionalProperties: false
    CliSourceConnectGuide:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        format:
          type: string
          enum:
            - markdown
        content:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        inputSchema:
          "$ref": "#/components/schemas/CliSourceConnectInputSchema"
        providers:
          type: array
          items:
            "$ref": "#/components/schemas/CliSourceConnectProviderGuide"
      required:
        - title
        - description
        - format
        - content
        - command
        - inputSchema
        - providers
      additionalProperties: false
    CliSourceConnectInputSchema:
      type: object
      properties:
        type:
          type: string
          enum:
            - object
        required:
          type: array
          items:
            type: string
            minLength: 1
        properties:
          "$ref": "#/components/schemas/CliSourceConnectInputSchemaProperties"
      required:
        - type
        - required
        - properties
      additionalProperties: false
    CliSourceConnectInputSchemaProperties:
      type: object
      properties:
        name:
          "$ref": "#/components/schemas/CliSourceConnectSchemaField"
        credentials:
          "$ref": "#/components/schemas/CliSourceConnectSchemaField"
      required:
        - name
        - credentials
      additionalProperties: false
    CliSourceConnectSchemaField:
      type: object
      properties:
        type:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        pattern:
          type: string
          minLength: 1
        enum:
          type: array
          items:
            type: string
            minLength: 1
      required:
        - type
        - description
      additionalProperties: false
    CliSourceConnectProviderGuide:
      type: object
      properties:
        provider:
          "$ref": "#/components/schemas/CliSourceProvider"
        summary:
          type: string
          minLength: 1
        requiredCredentialFields:
          type: array
          items:
            type: string
            minLength: 1
        optionalCredentialFields:
          type: array
          items:
            type: string
            minLength: 1
        steps:
          type: array
          items:
            type: string
            minLength: 1
        credentialTemplate:
          type: object
          additionalProperties: true
        exampleInput:
          type: object
          additionalProperties: true
      required:
        - provider
        - summary
        - requiredCredentialFields
        - optionalCredentialFields
        - steps
        - credentialTemplate
        - exampleInput
      additionalProperties: false
    CliSourceConnectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
        credentials:
          type: object
          additionalProperties: true
      required:
        - name
        - credentials
      additionalProperties: false
    CliSourceConnectResponse:
      type: object
      properties:
        source:
          "$ref": "#/components/schemas/CliSourceSummary"
        nextCommand:
          type: string
          minLength: 1
      required:
        - source
        - nextCommand
      additionalProperties: false
