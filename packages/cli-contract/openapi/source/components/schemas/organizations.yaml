components:
  schemas:
    CliOrgCapability:
      type: string
      enum:
        - org.list
        - org.read
        - source.connect
        - source.list
        - source.read
        - query.execute
    CliOrgGetEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliOrgReadResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliOrgListEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliOrgListResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
        page:
          "$ref": "./common.yaml#/components/schemas/CliPage"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
    CliOrgListResponse:
      type: object
      properties:
        organizations:
          type: array
          items:
            "$ref": "#/components/schemas/CliOrgSummary"
      required:
        - organizations
      additionalProperties: false
    CliOrgReadResponse:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            type: string
            minLength: 1
        capabilities:
          type: array
          items:
            "$ref": "#/components/schemas/CliOrgCapability"
      additionalProperties: false
    CliOrgSummary:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      additionalProperties: false
