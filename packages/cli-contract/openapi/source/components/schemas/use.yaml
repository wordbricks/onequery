components:
  schemas:
    CliUseSource:
      type: string
      enum:
        - amplitude
        - ga
        - github
        - mixpanel
        - mongodb
        - posthog
        - sentry
    CliUseResponse:
      type: object
      properties:
        source:
          "$ref": "#/components/schemas/CliUseSource"
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        format:
          type: string
          enum:
            - markdown
        content:
          type: string
          minLength: 1
      required:
        - source
        - title
        - description
        - format
        - content
      additionalProperties: false
    CliUseEnvelope:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          "$ref": "#/components/schemas/CliUseResponse"
        warnings:
          type: array
          items:
            "$ref": "./common.yaml#/components/schemas/CliWarning"
      required:
        - requestId
        - data
        - warnings
      additionalProperties: false
