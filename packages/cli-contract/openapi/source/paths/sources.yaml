x-cli-defaults:
  orgSlugParam: &orgSlugParam
    in: path
    name: orgSlug
    schema:
      type: string
      minLength: 1
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    required: true
  sourceProviderParam: &sourceProviderParam
    in: query
    name: source
    schema:
      "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceProvider"
    required: true

sources:
  get:
    operationId: cliSourceList
    description:
      List source metadata for the requested org. Any org member can read
      source metadata on the standard CLI surface.
    x-onequery-command: source list
    x-onequery-expose-command-schema: true
    x-onequery-kind: read
    x-onequery-read-controls:
      fields:
        support: supported
        unsupportedReason:
      limit:
        support: supported
        unsupportedReason:
      cursor:
        support: supported
        unsupportedReason:
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: true
    x-onequery-supports-pagination: true
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - invalid_request
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - in: query
        name: fields
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - *orgSlugParam
    responses:
      "200":
        description:
          Connected sources visible to the authenticated caller within
          that org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceListEnvelope"
            example:
              requestId: req_source_list_01
              data:
                sources:
                  - name: warehouse
                    displayName: Production Warehouse
                    provider: postgres
                    queryable: true
                    status: active
                  - name: product_analytics
                    displayName: Product Analytics
                    provider: posthog
                    queryable: false
                    status: active
              warnings: []
              page:
                nextCursor:
                returned: 2
                hasMore: false
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to list sources in the requested
          org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/org-not-found
              status: 404
              title: Organization Not Found
              detail: org `acme-missing` was not found
              code: org_not_found
              stage: resolve_org
              hint: run `oneq org list`
              requestId: req_source_list_org_not_found_01
              retryable: false
      "422":
        description: Requested org slug is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
source:
  get:
    operationId: cliSourceShow
    description:
      Show one source in the requested org. Any org member can read source
      metadata on the standard CLI surface.
    x-onequery-command: source show
    x-onequery-expose-command-schema: true
    x-onequery-kind: read
    x-onequery-read-controls:
      fields:
        support: supported
        unsupportedReason:
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: true
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - source_not_found
      - invalid_request
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - in: query
        name: fields
        schema:
          type: string
          minLength: 1
      - *orgSlugParam
      - in: path
        name: sourceKey
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
        required: true
    responses:
      "200":
        description: Source details for the requested source key
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceShowEnvelope"
            example:
              requestId: req_source_show_01
              data:
                name: warehouse
                displayName: Production Warehouse
                provider: postgres
                queryable: true
                status: active
              warnings: []
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to read source metadata in
          the requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug or source key does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/source-not-found
              status: 404
              title: Source Not Found
              detail: source `warehouse_missing` does not exist in org `acme`
              code: source_not_found
              stage: resolve_source
              hint: run `oneq source list`
              requestId: req_source_show_not_found_01
              retryable: false
      "422":
        description: The requested source key is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
sourceConnect:
  get:
    operationId: cliSourceConnectGuide
    description:
      Return step-by-step instructions plus machine-readable input guidance for
      connecting one provider-specific data source to the requested org.
    x-onequery-command: source connect guide
    x-onequery-expose-command-schema: false
    x-onequery-kind: discovery
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - invalid_request
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - *orgSlugParam
      - *sourceProviderParam
    responses:
      "200":
        description:
          Connect-source guide for the requested provider, including the
          required JSON contract and credential instructions
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceConnectGuideEnvelope"
            example:
              requestId: req_source_connect_guide_01
              data:
                title: OneQuery Source Connect Guide
                description: Follow these steps to gather credentials and create one postgres source connection.
                format: markdown
                content: |
                  1. Choose a CLI-safe source name such as `warehouse`.
                  2. Retrieve postgres credentials using the provider-specific steps.
                  3. Build one JSON payload with `name` and `credentials`.
                  4. Run `oneq source connect --source postgres --input '<json>'`.
                  5. Verify the result with `oneq source show <name>`.
                command: oneq source connect --source postgres --input '<json>'
                inputSchema:
                  type: object
                  required:
                    - name
                    - credentials
                  properties:
                    name:
                      type: string
                      description: CLI-safe org-unique source key
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
                    credentials:
                      type: object
                      description: Provider-specific credential object whose `type` matches the selected `--source`
                providers:
                  - provider: postgres
                    summary: Connect a Postgres database.
                    requiredCredentialFields:
                      - type
                      - host
                      - database
                      - username
                      - password
                    optionalCredentialFields:
                      - port
                      - sslMode
                    steps:
                      - Retrieve host, database name, username, and password from the Postgres deployment or secret manager.
                      - Choose the correct port and sslMode for that deployment.
                    credentialTemplate:
                      type: postgres
                      host: db.example.com
                      port: 5432
                      database: app
                      username: onequery
                      password: secret
                      sslMode: prefer
                    exampleInput:
                      name: warehouse
                      credentials:
                        type: postgres
                        host: db.example.com
                        port: 5432
                        database: app
                        username: onequery
                        password: secret
                        sslMode: prefer
              warnings: []
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to connect sources in the
          requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "422":
        description: Requested org slug is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
  post:
    operationId: cliSourceConnect
    description:
      Create one new org-scoped source connection for the selected provider
      from a JSON payload. The CLI injects org context from the selected org
      rather than taking it from `--input`.
    x-onequery-command: source connect
    x-onequery-expose-command-schema: true
    x-onequery-kind: mutate
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: true
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - invalid_request
      - source_name_conflict
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - *orgSlugParam
      - *sourceProviderParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceConnectRequest"
          example:
            name: warehouse
            credentials:
              type: postgres
              host: db.example.com
              port: 5432
              database: app
              username: onequery
              password: secret
              sslMode: prefer
    responses:
      "200":
        description: Source connection was created successfully
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/sources.yaml#/components/schemas/CliSourceConnectEnvelope"
            example:
              requestId: req_source_connect_02
              data:
                source:
                  name: warehouse
                  displayName:
                  provider: postgres
                  queryable: true
                  status: active
                nextCommand: oneq source show warehouse
              warnings: []
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to connect sources in the
          requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "409":
        description: Source name already exists in the requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/source-name-conflict
              status: 409
              title: Source Name Conflict
              detail: source `warehouse` already exists in org `acme`
              code: source_name_conflict
              stage: resolve_source
              hint: choose a different source name and retry
              requestId: req_source_connect_conflict_01
              retryable: false
      "422":
        description: Request body or org slug is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
