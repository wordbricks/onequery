session:
  get:
    operationId: cliSessionRead
    description:
      Return the current authenticated principal and active org context
      for the CLI surface.
    x-onequery-command: auth whoami
    x-onequery-expose-command-schema: true
    x-onequery-kind: read
    x-onequery-read-controls:
      fields:
        support: supported
        unsupportedReason:
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: true
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: false
    x-onequery-required-org-role:
    x-onequery-stable-error-codes:
      - not_logged_in
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - in: query
        name: fields
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: Current authenticated CLI session identity
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/auth.yaml#/components/schemas/CliSessionReadEnvelope"
            example:
              requestId: req_session_read_01
              data:
                authMode: browser_session
                user:
                  id: user-1
                  email: alice@example.com
                  displayName: Alice
                activeOrgSlug: acme
                issuedAt: "2026-03-10T00:00:00Z"
                expiresAt: "2026-03-17T00:00:00Z"
              warnings: []
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/not-logged-in
              status: 401
              title: Not Logged In
              detail: no authenticated session was found
              code: not_logged_in
              stage: auth
              hint: login via the OneQuery web app and retry
              requestId: req_session_read_unauthorized_01
              retryable: false
sessionRefresh:
  post:
    operationId: cliSessionRefresh
    description:
      Validate the current CLI bearer session and return the currently
      valid bearer token plus session metadata.
    x-onequery-command: auth session refresh
    x-onequery-expose-command-schema: true
    x-onequery-kind: mutate
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: false
    x-onequery-required-org-role:
    x-onequery-stable-error-codes:
      - not_logged_in
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    responses:
      "200":
        description: Current authenticated CLI session after refresh validation
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/auth.yaml#/components/schemas/CliSessionRefreshEnvelope"
            example:
              requestId: req_session_refresh_01
              data:
                accessToken: onequery_access_token_example
                authMode: bearer_token
                user:
                  id: user-1
                  email: alice@example.com
                  displayName: Alice
                activeOrgSlug: acme
                issuedAt: "2026-03-10T00:00:00Z"
                expiresAt: "2026-03-17T00:00:00Z"
              warnings: []
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/not-logged-in
              status: 401
              title: Not Logged In
              detail: no authenticated session was found
              code: not_logged_in
              stage: auth
              hint: login via the OneQuery web app and retry
              requestId: req_session_refresh_unauthorized_01
              retryable: false
