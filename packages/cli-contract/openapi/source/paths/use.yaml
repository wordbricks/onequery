use:
  get:
    operationId: cliUse
    description:
      Return provider-specific skill content for non-SQL OneQuery sources so agents
      can use the correct relay surface instead of SQL query execution.
    x-onequery-command: use
    x-onequery-expose-command-schema: true
    x-onequery-kind: discovery
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: false
    x-onequery-auth-requirements:
      authenticated: false
      modes:
        - none
      orgScoped: false
    x-onequery-required-org-role:
    x-onequery-stable-error-codes:
      - invalid_request
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - in: query
        name: source
        required: true
        schema:
          "$ref": "../components/schemas/use.yaml#/components/schemas/CliUseSource"
    responses:
      "200":
        description: Provider-specific skill content for the requested source kind
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/use.yaml#/components/schemas/CliUseEnvelope"
            example:
              requestId: req_use_01
              data:
                source: sentry
                title: OneQuery Sentry Relay Skill
                description: Use the Sentry relay route instead of SQL for a OneQuery-connected Sentry source.
                format: markdown
                content: |
                  # OneQuery Sentry Relay Skill

                  Use `POST /api/data-sources/sentry/query` with `method: "fetch_api"` and a bounded `request`.
              warnings: []
      "422":
        description: Requested source kind is not supported by the use surface
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/invalid-request
              status: 422
              title: Invalid Request
              detail: Invalid enum value. Expected 'amplitude' | 'ga' | 'github' | 'mixpanel' | 'mongodb' | 'posthog' | 'sentry', received 'linear'
              code: invalid_request
              stage: resolve_source
              hint: choose one of the supported use sources and retry
              requestId: req_use_invalid_01
              retryable: false
