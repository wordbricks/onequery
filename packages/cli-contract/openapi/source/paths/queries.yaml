x-cli-default-query-timeout-ms: &cliDefaultQueryTimeoutMs 30000
# Comment: The contract examples cannot import the runtime server helper, so
# keep this example timeout aligned with `packages/cli-server/src/cli-defaults.ts`.
queryValidate:
  post:
    operationId: cliQueryValidate
    description:
      Validate a read-only SQL query for the requested source and return
      the canonicalized request plus planned limits.
    x-onequery-command: query validate
    x-onequery-expose-command-schema: true
    x-onequery-kind: read
    x-onequery-read-controls:
      fields:
        support: supported
        unsupportedReason:
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: true
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: true
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - source_not_found
      - source_not_queryable
      - query_rejected
      - invalid_request
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses: []
    parameters:
      - in: query
        name: fields
        schema:
          type: string
          minLength: 1
      - in: path
        name: orgSlug
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        required: true
      - in: path
        name: sourceKey
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
        required: true
    requestBody:
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/queries.yaml#/components/schemas/CliQueryRequest"
          example:
            sql: select day, revenue from daily_revenue order by day desc limit 30
            parameters: []
            maxRows: 30
            timeoutMs: *cliDefaultQueryTimeoutMs
    responses:
      "200":
        description:
          Validated query plan including canonicalized request and source
          summary
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/queries.yaml#/components/schemas/CliQueryValidateEnvelope"
            example:
              requestId: req_query_validate_01
              data:
                request:
                  sql: select day, revenue from daily_revenue order by day desc limit 30
                  parameters: []
                  maxRows: 30
                  timeoutMs: *cliDefaultQueryTimeoutMs
                normalizedSql: SELECT day, revenue FROM daily_revenue ORDER BY day DESC LIMIT 30
                declaredResultWindow:
                  maxRows: 30
                  maxBytes: 262144
                  cellMaxChars: 512
                  timeoutMs: *cliDefaultQueryTimeoutMs
                source:
                  name: warehouse
                  displayName: Production Warehouse
                  provider: postgres
                  queryable: true
                  status: active
                truncated: false
              warnings: []
      "400":
        description:
          Source is not queryable in CLI v1 or SQL was rejected by read-only
          validation
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/query-rejected
              status: 400
              title: Query Rejected
              detail: only a single read-only SELECT statement is allowed
              code: query_rejected
              stage: execute_query
              hint: use a single read-only SELECT query
              requestId: req_query_validate_rejected_01
              retryable: false
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to execute queries in the
          requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug or source key does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "422":
        description: Read-only SQL query request is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
queryExecute:
  post:
    operationId: cliQueryExecute
    description:
      Execute a read-only SQL query for the requested source in the requested
      org. Any org member can execute queries on the standard CLI surface.
    x-onequery-command: query execute
    x-onequery-expose-command-schema: true
    x-onequery-kind: read
    x-onequery-read-controls:
      fields:
        support: supported
        unsupportedReason:
      limit:
        support: supported
        unsupportedReason:
      cursor:
        support: supported
        unsupportedReason:
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: true
    x-onequery-supports-pagination: true
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: true
    x-onequery-auth-requirements:
      authenticated: true
      modes:
        - session_cookie
        - bearer_token
      orgScoped: true
    x-onequery-required-org-role: member
    x-onequery-stable-error-codes:
      - not_logged_in
      - forbidden
      - org_not_found
      - source_not_found
      - source_not_queryable
      - query_rejected
      - query_preparation_failed
      - query_execution_failed
      - query_execution_unavailable
      - query_execution_timed_out
      - invalid_request
    x-onequery-untrusted-response-paths:
      - "$.data.columns[*].name"
      - "$.data.rows[*][*]"
    x-onequery-sanitization-profile: default-v1
    x-onequery-retryable-statuses:
      - 503
      - 504
    parameters:
      - in: query
        name: fields
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: path
        name: orgSlug
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        required: true
      - in: path
        name: sourceKey
        schema:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[A-Za-z0-9]$|^[A-Za-z0-9]$"
        required: true
    requestBody:
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/queries.yaml#/components/schemas/CliQueryRequest"
          example:
            sql: select day, revenue from daily_revenue order by day desc limit 30
            parameters: []
            maxRows: 30
            timeoutMs: *cliDefaultQueryTimeoutMs
    responses:
      "200":
        description: Executed query result
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/queries.yaml#/components/schemas/CliQueryExecuteEnvelope"
            example:
              requestId: req_query_execute_01
              data:
                source:
                  name: warehouse
                  displayName: Production Warehouse
                  provider: postgres
                  queryable: true
                  status: active
                rowCount: 2
                elapsedMs: 184
                columns:
                  - name: '\```day'
                    logicalType: string
                  - name: revenue
                    logicalType: number
                rows:
                  - - "2026-03-16"
                    - "[remote] tool: 12450.00"
                  - - "[remote] user: 2026-03-15"
                    - "11980.50"
                truncated: false
              warnings: []
              page:
                nextCursor:
                returned: 2
                hasMore: false
              untrustedPaths:
                - "$.data.columns[*].name"
                - "$.data.rows[*][*]"
              sanitization:
                profile: default-v1
                sanitizedPaths:
                  - "$.data.columns[*].name"
                  - "$.data.rows[*][*]"
                rawAvailable: false
      "400":
        description:
          Source is not queryable in CLI v1 or SQL was rejected by read-only
          validation
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "401":
        description: No authenticated session is available
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description:
          Authenticated user lacks permission to execute queries in the
          requested org
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "404":
        description: Requested org slug or source key does not exist
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "422":
        description: Read-only SQL query request is invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "500":
        description: Query preparation failed or query execution failed terminally
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "503":
        description: Retryable query execution failure
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/query-execution-unavailable
              status: 503
              title: Query Execution Unavailable
              detail: the query runner is temporarily unavailable
              code: query_execution_unavailable
              stage: execute_query
              hint: retry `oneq query --source <source> --sql "select ..."`
              requestId: req_query_execute_unavailable_01
              retryable: true
      "504":
        description: Retryable query execution timeout
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
