deviceAuthorizations:
  post:
    operationId: cliAuthDeviceAuthorizationStart
    description:
      Start CLI device authorization and return the pending session metadata
      on the canonical OneQuery auth workflow surface.
    x-onequery-command: auth login start
    x-onequery-expose-command-schema: false
    x-onequery-kind: mutate
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: true
    x-onequery-auth-requirements:
      authenticated: false
      modes:
        - none
      orgScoped: false
    x-onequery-required-org-role:
    x-onequery-stable-error-codes:
      - invalid_request
      - login_rate_limited
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses:
      - 429
    parameters: []
    responses:
      "200":
        description: Started device authorization session
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/auth.yaml#/components/schemas/CliAuthDeviceAuthorizationStartEnvelope"
            example:
              requestId: req_device_start_01
              data:
                state: pending
                deviceCode: device-code-example
                userCode: ABCD-1234
                verificationUrl: https://example.test/api/device
                verificationCompleteUrl: https://example.test/api/device?user_code=ABCD-1234
                pollAfterMs: 5000
                expiresAt: "2026-03-17T00:15:00Z"
              warnings: []
      "400":
        description: Device authorization request was invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "429":
        description: Device authorization request was rate-limited
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/login-rate-limited
              status: 429
              title: Login Rate Limited
              detail: too many login attempts from this client
              code: login_rate_limited
              stage: auth
              hint: wait briefly, then retry `onequery auth login`
              requestId: req_device_start_rate_limited_01
              retryable: true
              retryAfterMs: 60000
deviceAuthorizationsPoll:
  post:
    operationId: cliAuthDeviceAuthorizationPoll
    description:
      Poll a pending device authorization session until it becomes authorized,
      remains pending, or fails terminally.
    x-onequery-command: auth login poll
    x-onequery-expose-command-schema: false
    x-onequery-kind: mutate
    x-onequery-read-controls:
      fields:
        support: unsupported
        unsupportedReason: not_available
      limit:
        support: unsupported
        unsupportedReason: not_paginated
      cursor:
        support: unsupported
        unsupportedReason: not_paginated
      sort:
        support: unsupported
        unsupportedReason: not_sortable
    x-onequery-supports-fields: false
    x-onequery-supports-pagination: false
    x-onequery-supports-dry-run: false
    x-onequery-supports-raw-input: true
    x-onequery-auth-requirements:
      authenticated: false
      modes:
        - none
      orgScoped: false
    x-onequery-required-org-role:
    x-onequery-stable-error-codes:
      - invalid_request
      - login_denied
      - login_rate_limited
      - login_session_expired
    x-onequery-untrusted-response-paths: []
    x-onequery-sanitization-profile:
    x-onequery-retryable-statuses:
      - 429
    parameters: []
    requestBody:
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/auth.yaml#/components/schemas/CliAuthDeviceAuthorizationPollRequest"
          example:
            deviceCode: device-code-example
    responses:
      "200":
        description: Device authorization is pending or completed with session metadata
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/auth.yaml#/components/schemas/CliAuthDeviceAuthorizationPollEnvelope"
            example:
              requestId: req_device_poll_01
              data:
                state: authorized
                accessToken: onequery_access_token_example
                authMode: browser_session
                user:
                  id: user-1
                  email: alice@example.com
                  displayName: Alice
                activeOrgSlug: acme
                issuedAt: "2026-03-17T00:01:00Z"
                expiresAt: "2026-03-24T00:01:00Z"
              warnings: []
      "400":
        description: Device authorization request was invalid
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "403":
        description: Device authorization was denied
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
            example:
              type: https://onequery.invalid/problems/cli/login-denied
              status: 403
              title: Login Denied
              detail: device authorization was denied by the user
              code: login_denied
              stage: auth
              hint: run `onequery auth login` again
              requestId: req_device_poll_denied_01
              retryable: false
      "410":
        description: Device authorization session expired
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
      "429":
        description: Device authorization polling was rate-limited
        content:
          application/json:
            schema:
              "$ref": "../components/schemas/common.yaml#/components/schemas/CliProblem"
