<svg width="1400" height="880" viewBox="0 0 1400 880" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OneQuery local gateway dashboard</title>
  <desc id="desc">A sample OneQuery dashboard with connected sources, recent queries, budget status, and runtime activity.</desc>
  <style>
    text { font-family: "Geist", "Segoe UI", sans-serif; fill: #111827; }
    .muted { fill: #667085; }
    .soft { fill: #98A2B3; }
    .heading { font-size: 24px; font-weight: 650; letter-spacing: -0.03em; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
    .body { font-size: 15px; font-weight: 500; }
    .small { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
    .number { font-size: 34px; font-weight: 700; letter-spacing: -0.05em; }
    .pill { font-size: 12px; font-weight: 700; }
  </style>

  <rect width="1400" height="880" rx="28" fill="#F3F6FB"/>
  <rect x="24" y="24" width="1352" height="832" rx="24" fill="#FFFFFF"/>
  <rect x="24" y="24" width="268" height="832" rx="24" fill="#0D1322"/>
  <rect x="308" y="52" width="1038" height="72" rx="18" fill="#F8FAFC"/>
  <rect x="332" y="72" width="172" height="32" rx="16" fill="#EDF2FF"/>
  <text x="360" y="93" class="pill" fill="#3154C9">Local gateway</text>
  <text x="540" y="96" class="body">127.0.0.1:5656</text>
  <rect x="1166" y="68" width="148" height="40" rx="14" fill="#0F172A"/>
  <text x="1200" y="93" class="pill" fill="#FFFFFF">Gateway running</text>

  <text x="64" y="84" font-size="22" font-weight="700" fill="#FFFFFF">OneQuery</text>
  <text x="64" y="118" class="small" fill="#97A3B6">Self-hosted control plane</text>

  <rect x="56" y="160" width="204" height="114" rx="18" fill="#121B2E"/>
  <text x="76" y="190" class="label" fill="#A8B3C5">Runtime</text>
  <text x="76" y="228" class="number" fill="#FFFFFF">Healthy</text>
  <text x="76" y="256" class="body" fill="#C8D1DE">3 active sessions</text>
  <circle cx="232" cy="190" r="7" fill="#45C17C"/>

  <text x="64" y="332" class="label" fill="#7C8799">Navigation</text>
  <rect x="56" y="350" width="204" height="44" rx="14" fill="#EEF3FF"/>
  <text x="82" y="378" class="body" fill="#1D4ED8">Overview</text>
  <text x="82" y="426" class="body" fill="#D7DEEA">Sources</text>
  <text x="82" y="466" class="body" fill="#D7DEEA">Queries</text>
  <text x="82" y="506" class="body" fill="#D7DEEA">Budgets</text>
  <text x="82" y="546" class="body" fill="#D7DEEA">Members</text>
  <text x="82" y="586" class="body" fill="#D7DEEA">Settings</text>
  <circle cx="66" cy="374" r="6" fill="#4B77FF"/>
  <circle cx="66" cy="422" r="6" fill="#6B7280"/>
  <circle cx="66" cy="462" r="6" fill="#6B7280"/>
  <circle cx="66" cy="502" r="6" fill="#6B7280"/>
  <circle cx="66" cy="542" r="6" fill="#6B7280"/>
  <circle cx="66" cy="582" r="6" fill="#6B7280"/>

  <rect x="332" y="154" width="232" height="144" rx="20" fill="#F8FAFC"/>
  <text x="356" y="188" class="label muted">Connected sources</text>
  <text x="356" y="242" class="number">12</text>
  <text x="356" y="272" class="body muted">Postgres, BigQuery, GitHub, Linear, Sentry</text>
  <rect x="356" y="220" width="80" height="10" rx="5" fill="#DCE6FF"/>
  <rect x="356" y="286" width="124" height="10" rx="5" fill="#D7F4E2"/>

  <rect x="580" y="154" width="232" height="144" rx="20" fill="#F8FAFC"/>
  <text x="604" y="188" class="label muted">Monthly budget</text>
  <text x="604" y="242" class="number">$12.4k</text>
  <text x="604" y="272" class="body muted">$4.2k used this month</text>
  <path d="M606 253 C640 224 674 235 706 212 C738 188 756 206 788 182" stroke="#D18A32" stroke-width="4" stroke-linecap="round"/>
  <circle cx="788" cy="182" r="6" fill="#D18A32"/>

  <rect x="828" y="154" width="232" height="144" rx="20" fill="#F8FAFC"/>
  <text x="852" y="188" class="label muted">Connector health</text>
  <text x="852" y="242" class="number">3/3</text>
  <text x="852" y="272" class="body muted">Customer-side connectors online</text>
  <rect x="852" y="220" width="150" height="12" rx="6" fill="#D7F4E2"/>
  <rect x="1008" y="220" width="24" height="12" rx="6" fill="#86D4A3"/>

  <rect x="1076" y="154" width="238" height="144" rx="20" fill="#F8FAFC"/>
  <text x="1100" y="188" class="label muted">Policy status</text>
  <text x="1100" y="242" class="number">Read-only</text>
  <text x="1100" y="272" class="body muted">Single statement guard enabled</text>
  <rect x="1100" y="214" width="102" height="32" rx="16" fill="#E8F0FF"/>
  <text x="1122" y="235" class="pill" fill="#3154C9">Enforced</text>

  <rect x="332" y="326" width="690" height="478" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="360" y="366" class="heading">Recent query activity</text>
  <text x="360" y="396" class="body muted">Shared state across CLI, browser, and connector execution</text>

  <rect x="360" y="432" width="634" height="52" rx="14" fill="#F8FAFC"/>
  <text x="384" y="464" class="small muted">SOURCE</text>
  <text x="546" y="464" class="small muted">QUERY</text>
  <text x="756" y="464" class="small muted">STATUS</text>
  <text x="866" y="464" class="small muted">DURATION</text>
  <text x="946" y="464" class="small muted">COST</text>

  <rect x="360" y="496" width="634" height="74" rx="16" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="384" y="534" class="body">warehouse</text>
  <text x="546" y="526" class="body">daily agent spend by team</text>
  <text x="546" y="548" class="small muted">select day, team, sum(total_usd)</text>
  <rect x="748" y="514" width="92" height="28" rx="14" fill="#DFF6E8"/>
  <text x="774" y="533" class="pill" fill="#18794E">Completed</text>
  <text x="872" y="534" class="body">2.3s</text>
  <text x="948" y="534" class="body">$1.80</text>

  <rect x="360" y="582" width="634" height="74" rx="16" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="384" y="620" class="body">athena-prod</text>
  <text x="546" y="612" class="body">top 20 customers by storage cost</text>
  <text x="546" y="634" class="small muted">connector-backed execution</text>
  <rect x="748" y="600" width="92" height="28" rx="14" fill="#FFF0DA"/>
  <text x="777" y="619" class="pill" fill="#9A5C07">Running</text>
  <text x="872" y="620" class="body">11.4s</text>
  <text x="948" y="620" class="body">$2.40</text>

  <rect x="360" y="668" width="634" height="108" rx="16" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="384" y="706" class="body">github-product</text>
  <text x="546" y="698" class="body">open issues grouped by label</text>
  <text x="546" y="720" class="small muted">connector token refreshed, retry succeeded</text>
  <rect x="748" y="686" width="92" height="28" rx="14" fill="#E8F0FF"/>
  <text x="777" y="705" class="pill" fill="#3154C9">Recovered</text>
  <text x="872" y="706" class="body">4.7s</text>
  <text x="948" y="706" class="body">$0.00</text>
  <path d="M546 738 H888" stroke="#D8DEE8" stroke-width="8" stroke-linecap="round"/>
  <path d="M546 754 H824" stroke="#E7EBF2" stroke-width="8" stroke-linecap="round"/>

  <rect x="1046" y="326" width="268" height="478" rx="22" fill="#0F172A"/>
  <text x="1072" y="366" class="heading" fill="#FFFFFF">Active run</text>
  <text x="1072" y="396" class="body" fill="#A8B3C5">Budget-aware execution path</text>

  <rect x="1072" y="432" width="216" height="110" rx="18" fill="#111C31"/>
  <text x="1092" y="462" class="label" fill="#8DA0BC">Current source</text>
  <text x="1092" y="500" font-size="24" font-weight="700" fill="#FFFFFF">athena-prod</text>
  <text x="1092" y="528" class="body" fill="#CBD5E1">Connector in us-west-2</text>

  <rect x="1072" y="560" width="216" height="94" rx="18" fill="#111C31"/>
  <text x="1092" y="590" class="label" fill="#8DA0BC">Last event</text>
  <text x="1092" y="624" class="body" fill="#FFFFFF">Query plan dispatched</text>
  <text x="1092" y="646" class="small" fill="#A8B3C5">Awaiting result page 1 of 4</text>

  <rect x="1072" y="672" width="216" height="104" rx="18" fill="#111C31"/>
  <text x="1092" y="702" class="label" fill="#8DA0BC">Controls</text>
  <rect x="1092" y="724" width="74" height="32" rx="16" fill="#E8F0FF"/>
  <text x="1116" y="745" class="pill" fill="#3154C9">Inspect</text>
  <rect x="1178" y="724" width="88" height="32" rx="16" fill="#FFF0DA"/>
  <text x="1207" y="745" class="pill" fill="#9A5C07">Cancel</text>
</svg>
