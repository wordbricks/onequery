<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OneQuery - Governed Data Access for AI Agents</title>
  <desc id="desc">OneQuery gives AI agents governed access to production context without sharing production keys.</desc>
