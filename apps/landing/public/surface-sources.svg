  <text x="764" y="459" class="pill" fill="#3154C9">Token ok</text>

  <rect x="334" y="516" width="506" height="86" rx="18" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="360" y="550" class="body">athena-customer-east</text>
  <text x="360" y="574" class="small muted">Outbound-only connector on customer VPC</text>
  <text x="548" y="558" class="body">aws_athena_connector</text>
  <text x="660" y="558" class="body">Customer success</text>
  <rect x="726" y="542" width="94" height="28" rx="14" fill="#FFF0DA"/>
  <text x="751" y="561" class="pill" fill="#9A5C07">Connector</text>

  <rect x="334" y="618" width="506" height="124" rx="18" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="360" y="652" class="body">linear-roadmap</text>
  <text x="360" y="676" class="small muted">Roadmap issues and delivery metadata</text>
  <text x="548" y="660" class="body">linear</text>
  <text x="660" y="660" class="body">Operations</text>
  <rect x="744" y="644" width="76" height="28" rx="14" fill="#FDECEC"/>
  <text x="766" y="663" class="pill" fill="#B42318">Refresh</text>
  <text x="360" y="714" class="small muted">Next action: rotate API token or reconnect from the browser.</text>

  <rect x="894" y="48" width="338" height="724" rx="22" fill="#0F172A"/>
  <text x="924" y="90" class="heading" fill="#FFFFFF">Source details</text>
  <text x="924" y="118" class="body" fill="#A8B3C5">athena-customer-east</text>

  <rect x="924" y="152" width="278" height="120" rx="18" fill="#111C31"/>
  <text x="948" y="184" class="label" fill="#8DA0BC">Connection path</text>
