<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OneQuery source catalog</title>
  <desc id="desc">A sample OneQuery source catalog showing database, analytics, and API providers with statuses and ownership.</desc>
  <style>
    text { font-family: "Geist", "Segoe UI", sans-serif; fill: #111827; }
    .muted { fill: #667085; }
    .soft { fill: #98A2B3; }
    .heading { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .body { font-size: 15px; font-weight: 500; }
    .small { font-size: 12px; font-weight: 600; }
    .pill { font-size: 12px; font-weight: 700; }
  </style>

  <rect width="1280" height="820" rx="26" fill="#F4F7FB"/>
  <rect x="24" y="24" width="1232" height="772" rx="24" fill="#FFFFFF"/>

  <rect x="48" y="48" width="232" height="724" rx="22" fill="#F8FAFC"/>
  <text x="74" y="90" class="heading">Providers</text>
  <text x="74" y="118" class="body muted">One gateway, many source types</text>

  <rect x="66" y="156" width="196" height="46" rx="14" fill="#EEF3FF"/>
  <circle cx="92" cy="179" r="7" fill="#4B77FF"/>
  <text x="110" y="184" class="body" fill="#1D4ED8">All sources</text>

  <circle cx="92" cy="236" r="7" fill="#7AB65A"/>
  <text x="110" y="241" class="body">Databases</text>
  <circle cx="92" cy="286" r="7" fill="#2FB3C8"/>
  <text x="110" y="291" class="body">Analytics</text>
  <circle cx="92" cy="336" r="7" fill="#D18A32"/>
  <text x="110" y="341" class="body">APIs and SaaS</text>
  <circle cx="92" cy="386" r="7" fill="#111827"/>
  <text x="110" y="391" class="body">Connector-backed</text>

  <text x="74" y="470" class="label muted">Runtime status</text>
  <rect x="66" y="494" width="196" height="102" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="86" y="526" class="small muted">Ready</text>
  <text x="86" y="552" font-size="30" font-weight="700">14</text>
  <text x="172" y="552" class="small muted">sources queryable</text>
  <path d="M86 572 H232" stroke="#D7F4E2" stroke-width="10" stroke-linecap="round"/>
  <path d="M86 590 H184" stroke="#E8F0FF" stroke-width="10" stroke-linecap="round"/>

  <text x="74" y="650" class="small muted">Protected credentials remain inside</text>
  <text x="74" y="674" class="small muted">customer networks when needed.</text>

  <rect x="304" y="48" width="566" height="724" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
