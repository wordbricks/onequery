  <text x="948" y="246" class="small" fill="#A8B3C5">Registration token scoped to one org</text>

  <rect x="924" y="290" width="278" height="112" rx="18" fill="#111C31"/>
  <text x="948" y="322" class="label" fill="#8DA0BC">Guardrails</text>
  <text x="948" y="356" class="body" fill="#FFFFFF">Read-only validation</text>
  <text x="948" y="380" class="small" fill="#A8B3C5">Single statement, cost-aware execution</text>

  <rect x="924" y="420" width="278" height="144" rx="18" fill="#111C31"/>
  <text x="948" y="452" class="label" fill="#8DA0BC">Runtime ownership</text>
  <text x="948" y="486" class="body" fill="#FFFFFF">Operator: Customer success</text>
  <text x="948" y="512" class="small" fill="#A8B3C5">Last check-in 41s ago</text>
  <text x="948" y="538" class="small" fill="#A8B3C5">Region us-east-1</text>

  <rect x="924" y="582" width="278" height="160" rx="18" fill="#111C31"/>
  <text x="948" y="614" class="label" fill="#8DA0BC">Next steps</text>
  <rect x="948" y="636" width="96" height="32" rx="16" fill="#E8F0FF"/>
  <text x="977" y="657" class="pill" fill="#3154C9">Inspect</text>
  <rect x="1056" y="636" width="122" height="32" rx="16" fill="#FFF0DA"/>
  <text x="1089" y="657" class="pill" fill="#9A5C07">Run test query</text>
  <text x="948" y="702" class="small" fill="#A8B3C5">Protected credentials never leave</text>
  <text x="948" y="722" class="small" fill="#A8B3C5">the customer network boundary.</text>
</svg>
