  <text x="360" y="370" class="small muted">Monthly spend and invoice reporting</text>
  <text x="548" y="354" class="body">bigquery</text>
  <text x="660" y="354" class="body">Finance</text>
  <rect x="756" y="338" width="64" height="28" rx="14" fill="#DFF6E8"/>
  <text x="774" y="357" class="pill" fill="#18794E">Ready</text>

  <rect x="334" y="414" width="506" height="86" rx="18" fill="#FCFDFE" stroke="#EEF2F6"/>
