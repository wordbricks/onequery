  <text x="334" y="118" class="body muted">Recent connections across data, analytics, and APIs</text>

  <rect x="334" y="148" width="506" height="44" rx="14" fill="#F8FAFC"/>
  <text x="360" y="176" class="small muted">KEY</text>
  <text x="548" y="176" class="small muted">TYPE</text>
  <text x="660" y="176" class="small muted">OWNER</text>
  <text x="766" y="176" class="small muted">STATUS</text>

  <rect x="334" y="210" width="506" height="86" rx="18" fill="#FCFDFE" stroke="#EEF2F6"/>
  <text x="360" y="244" class="body">warehouse</text>
  <text x="360" y="268" class="small muted">Primary Postgres analytics warehouse</text>
  <text x="548" y="252" class="body">postgres</text>
  <text x="660" y="252" class="body">Platform ops</text>
