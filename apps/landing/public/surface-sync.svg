<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OneQuery shared runtime state</title>
  <desc id="desc">A sample split view showing the OneQuery CLI and browser dashboard synchronized around the same gateway state.</desc>
  <style>
    text { font-family: "Geist", "Segoe UI", sans-serif; fill: #111827; }
    .muted { fill: #667085; }
    .heading { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .body { font-size: 15px; font-weight: 500; }
    .small { font-size: 12px; font-weight: 600; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 15px; }
    .mono-small { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; }
    .pill { font-size: 12px; font-weight: 700; }
  </style>

  <rect width="1280" height="820" rx="26" fill="#F4F7FB"/>
  <rect x="24" y="24" width="1232" height="772" rx="24" fill="#FFFFFF"/>

  <text x="64" y="82" class="heading">Shared runtime state</text>
  <text x="64" y="112" class="body muted">The terminal and browser stay attached to the same gateway lifecycle.</text>

  <rect x="64" y="152" width="520" height="592" rx="24" fill="#0E1321"/>
  <text x="96" y="198" class="heading" fill="#FFFFFF">CLI session</text>
  <text x="96" y="226" class="small" fill="#94A3B8">Connected to localhost:5656</text>

  <rect x="96" y="258" width="456" height="58" rx="16" fill="#111C31"/>
  <text x="118" y="294" class="mono" fill="#E2E8F0">$ onequery gateway start</text>
  <circle cx="514" cy="288" r="7" fill="#45C17C"/>

  <rect x="96" y="332" width="456" height="58" rx="16" fill="#111C31"/>
  <text x="118" y="368" class="mono" fill="#E2E8F0">$ onequery auth login</text>
  <rect x="420" y="347" width="108" height="28" rx="14" fill="#E8F0FF"/>
  <text x="449" y="366" class="pill" fill="#3154C9">Authenticated</text>

  <rect x="96" y="406" width="456" height="96" rx="16" fill="#111C31"/>
  <text x="118" y="440" class="mono" fill="#E2E8F0">$ onequery source connect --source postgres</text>
  <text x="118" y="468" class="mono-small" fill="#CBD5E1">name: warehouse</text>
  <text x="118" y="490" class="mono-small" fill="#CBD5E1">status: ready</text>
  <rect x="420" y="454" width="92" height="28" rx="14" fill="#DFF6E8"/>
  <text x="447" y="473" class="pill" fill="#18794E">Source ready</text>

  <rect x="96" y="520" width="456" height="170" rx="16" fill="#111C31"/>
  <text x="118" y="554" class="mono" fill="#E2E8F0">$ onequery query exec --source warehouse</text>
  <text x="118" y="580" class="mono-small" fill="#94A3B8">select day, sum(total_usd) from agent_runs ...</text>
  <text x="118" y="620" class="mono-small" fill="#CBD5E1">status: failed</text>
  <text x="118" y="646" class="mono-small" fill="#CBD5E1">reason: session refresh required</text>
  <text x="118" y="672" class="mono-small" fill="#CBD5E1">next: retry onequery query exec --source warehouse ...</text>
  <rect x="404" y="604" width="124" height="28" rx="14" fill="#FDECEC"/>
  <text x="443" y="623" class="pill" fill="#B42318">Retryable</text>

  <circle cx="640" cy="236" r="8" fill="#4B77FF"/>
  <circle cx="640" cy="358" r="8" fill="#4B77FF"/>
  <circle cx="640" cy="480" r="8" fill="#4B77FF"/>
  <circle cx="640" cy="602" r="8" fill="#4B77FF"/>
  <path d="M640 236 H736" stroke="#4B77FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 358 H736" stroke="#4B77FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 480 H736" stroke="#4B77FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 602 H736" stroke="#4B77FF" stroke-width="4" stroke-linecap="round"/>
  <text x="662" y="226" class="small" fill="#3154C9">Runtime started</text>
  <text x="662" y="348" class="small" fill="#3154C9">Session shared</text>
  <text x="662" y="470" class="small" fill="#3154C9">Source visible</text>
  <text x="662" y="592" class="small" fill="#3154C9">Retry status visible</text>

  <rect x="736" y="152" width="480" height="592" rx="24" fill="#F8FAFC" stroke="#E5E7EB"/>
  <text x="768" y="198" class="heading">Browser view</text>
  <text x="768" y="226" class="small muted">Same gateway, same source state, same recent activity</text>

  <rect x="768" y="258" width="416" height="78" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="792" y="286" class="label muted">Gateway</text>
  <text x="792" y="314" class="body">Running on localhost:5656</text>
  <rect x="1040" y="278" width="118" height="32" rx="16" fill="#DFF6E8"/>
  <text x="1076" y="299" class="pill" fill="#18794E">Healthy</text>

  <rect x="768" y="356" width="416" height="118" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="792" y="384" class="label muted">Source status</text>
  <text x="792" y="414" class="body">warehouse</text>
  <text x="792" y="438" class="small muted">Postgres analytics warehouse</text>
  <rect x="1048" y="398" width="110" height="32" rx="16" fill="#E8F0FF"/>
  <text x="1077" y="419" class="pill" fill="#3154C9">Connected</text>
  <path d="M792 454 H1048" stroke="#DCE3EE" stroke-width="8" stroke-linecap="round"/>

  <rect x="768" y="494" width="416" height="112" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="792" y="522" class="label muted">Recent query</text>
  <text x="792" y="552" class="body">daily spend by day</text>
  <text x="792" y="576" class="small muted">Failed because the auth session needed refresh</text>
  <rect x="1044" y="536" width="114" height="32" rx="16" fill="#FDECEC"/>
  <text x="1072" y="557" class="pill" fill="#B42318">Needs retry</text>

  <rect x="768" y="626" width="416" height="94" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="792" y="654" class="label muted">Suggested action</text>
  <text x="792" y="684" class="body">Refresh the session, then rerun from the CLI or UI.</text>
  <rect x="1032" y="668" width="126" height="32" rx="16" fill="#EEF3FF"/>
  <text x="1062" y="689" class="pill" fill="#3154C9">Retry query</text>
</svg>
