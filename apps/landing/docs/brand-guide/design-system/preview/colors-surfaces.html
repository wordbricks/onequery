<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script type="module">
      import {
        grid,
        renderPage,
        section,
        swatch,
        tokens,
      } from "./components.js";

      renderPage({
        title: "Surface Colors",
        description:
          "Surfaces use alpha-black structure over a white canvas. Avoid tinted section bands as the main page system.",
        sections: [
          section({
            title: "Interface surfaces",
            description:
              "Use these for borders, dividers, muted text, selected states, and quiet UI chrome.",
            content: grid([
              swatch({
                name: "Surface Muted",
                value: tokens.colors.surfaceMuted,
                usage: "Quiet section or product UI tint",
              }),
              swatch({
                name: "Muted Text",
                value: tokens.colors.mutedText,
                usage: "Primary paragraph copy",
              }),
              swatch({
                name: "Soft Text",
                value: tokens.colors.softText,
                usage: "Metadata and secondary links",
              }),
              swatch({
                name: "Line",
                value: tokens.colors.line,
                usage: "Standard borders and dividers",
              }),
              swatch({
                name: "Strong Line",
                value: tokens.colors.strongLine,
                usage: "Stronger borders when needed",
              }),
              swatch({
                name: "Wash",
                value: tokens.colors.wash,
                usage: "Chip fills and quiet selected states",
              }),
            ]),
          }),
        ],
      });
    </script>
  </body>
</html>
