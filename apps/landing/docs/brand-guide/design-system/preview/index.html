<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script type="module">
      import {
        badge,
        button,
        card,
        grid,
        renderPage,
        row,
        section,
        terminal,
      } from "./components.js";

      renderPage({
        title: "Design System Preview",
        description:
          "A browsable implementation of the OneQuery brand guide. These static previews define reusable components in code and render the current visual rules for brand, product UI, and developer-facing surfaces.",
        sections: [
          section({
            title: "Core expression",
            description:
              "Quiet, precise, developer-first components using white surfaces, near-black type, alpha-black structure, and the shipped OneQuery icon.",
            content: grid([
              card({
                title: "Controlled query access",
                description:
                  "Components show bounded states: connected, validating, blocked, complete, and audited.",
                badgeLabel: "Product proof",
              }),
              card({
                title: "Agent-ready without AI theater",
                description:
                  "Agent workflows use the same controls, records, and policy surfaces as developer workflows.",
                badgeLabel: "Core",
              }),
              card({
                title: "Evidence over decoration",
                description:
                  "Preview surfaces prioritize labels, records, source names, and query status over abstract visuals.",
                badgeLabel: "Brand rule",
              }),
            ]),
          }),
          section({
            title: "Common actions",
            description:
              "Use compact literal commands. Primary actions stay black; secondary actions stay quiet.",
            content: row([
              button({ label: "Connect source", iconName: "database" }),
              button({
                label: "Run query",
                variant: "secondary",
                iconName: "play",
              }),
              button({
                label: "View audit log",
                variant: "outline",
                iconName: "file",
              }),
              badge({ label: "read-only", variant: "outline" }),
              badge({
                label: "connected",
                variant: "success",
                iconName: "check",
              }),
            ]),
          }),
          section({
            title: "Workflow sample",
            description:
              "Product UI should prove a real state, not imply a generic dashboard.",
            content: terminal([
              '<span class="oq-muted">$</span> onequery query exec --source postgres://warehouse --sql "SELECT 1"',
              '<span class="oq-muted">source</span> bigquery://analytics-prod connected as read-only',
              '<span class="oq-muted">policy</span> cost limit: $5.00, approval required for agents',
              '<span class="oq-muted">audit</span> record created: qry_4Z9K2',
            ]),
          }),
        ],
      });
    </script>
  </body>
</html>
