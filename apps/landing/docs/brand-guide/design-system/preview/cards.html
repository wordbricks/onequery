<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script type="module">
      import { badge, card, grid, renderPage, section } from "./components.js";

      renderPage({
        title: "Cards",
        description:
          "Cards frame actual product evidence. Keep them quiet, bounded, and readable; avoid decorative nested panels.",
        sections: [
          section({
            title: "Product state cards",
            description: "Each card should prove one workflow state.",
            content: grid([
              card({
                title: "Source connected",
                description:
                  "postgres://warehouse is available through a read-only policy. Last heartbeat arrived 12s ago.",
                badgeLabel: "Active",
                footer: `${badge({ label: "read-only", variant: "outline" })} ${badge({ label: "heartbeat 12s", variant: "success" })}`,
              }),
              card({
                title: "Query validating",
                description:
                  "The SQL request is being checked against cost, source, and requester policy before execution.",
                badgeLabel: "Pending",
                footer: `${badge({ label: "cost limit $5", variant: "secondary" })} ${badge({ label: "policy gate", variant: "outline" })}`,
              }),
              card({
                title: "Agent query blocked",
                description:
                  "The agent requested a table outside its approved source list. The failure becomes an audit state.",
                badgeLabel: "Blocked",
                footer: `${badge({ label: "source denied", variant: "error" })} ${badge({ label: "recorded", variant: "outline" })}`,
              }),
            ]),
          }),
        ],
      });
    </script>
  </body>
</html>
