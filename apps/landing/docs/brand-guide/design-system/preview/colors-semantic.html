<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script type="module">
      import {
        grid,
        renderPage,
        section,
        swatch,
        tokens,
      } from "./components.js";

      renderPage({
        title: "Semantic Colors",
        description:
          "Semantic colors stay local to product states. Pair color with labels, icons, or text so state never depends on color alone.",
        sections: [
          section({
            title: "State tokens",
            description:
              "Use these for status messaging, query lifecycle, and demo UI.",
            content: grid([
              swatch({
                name: "Success Background",
                value: tokens.colors.successBg,
                usage: "Connected, complete, approved",
              }),
              swatch({
                name: "Success Text",
                value: tokens.colors.successText,
                usage: "Success labels",
              }),
              swatch({
                name: "Warning Background",
                value: tokens.colors.warningBg,
                usage: "Pending or attention states",
              }),
              swatch({
                name: "Warning Text",
                value: tokens.colors.warningText,
                usage: "Warning labels",
              }),
              swatch({
                name: "Error Background",
                value: tokens.colors.errorBg,
                usage: "Blocked or denied states",
              }),
              swatch({
                name: "Error Text",
                value: tokens.colors.errorText,
                usage: "Error labels",
              }),
            ]),
          }),
        ],
      });
    </script>
  </body>
</html>
