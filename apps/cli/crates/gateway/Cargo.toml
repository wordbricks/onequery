[package]
name = "onequery-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
chrono = { workspace = true, features = ["serde"] }
connectrpc = { workspace = true, features = ["client", "server", "gzip"] }
futures = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = [
  "http1",
  "http2",
  "server",
  "tokio",
] }
onequery-connect-support = { workspace = true }
onequery-core = { workspace = true }
onequery-proto-runtime = { workspace = true }
onequery-utils-string = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
toml = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
http-body-util = { workspace = true }
insta = { workspace = true, features = ["filters"] }
onequery-utils = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
