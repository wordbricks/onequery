[package]
name = "onequery-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "onequery"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
connectrpc = { workspace = true, features = ["client", "client-tls", "gzip"] }
flate2 = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
jaq-core = { workspace = true }
jaq-json = { workspace = true, features = ["serde"] }
jaq-std = { workspace = true }
regress = { workspace = true }
serde = { workspace = true, features = ["derive"] }
shlex = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
time = { workspace = true, features = ["formatting", "parsing"] }
ureq = { workspace = true, features = ["json", "rustls"] }
url = { workspace = true }
webbrowser = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
webpki-roots = { workspace = true }
onequery-core = { workspace = true }
onequery-connect-support = { workspace = true }
onequery-config = { workspace = true }
onequery-gateway = { workspace = true }
onequery-install-context = { workspace = true }
onequery-proto-cli = { workspace = true }
onequery-source-connect-cli = { workspace = true }
onequery-utils = { workspace = true }
onequery-utils-path = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true, features = ["filters"] }
onequery-core-test-support = { workspace = true }

[lints]
workspace = true
