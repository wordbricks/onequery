[package]
name = "onequery-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "onequery"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
buffa = { version = "0.3.0", features = ["json"] }
buffa-types = { version = "0.3.0", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
connectrpc = { version = "0.3.2", features = ["client", "client-tls"] }
dirs = { workspace = true }
flate2 = "1.1.5"
getrandom = "0.3"
http = "1"
http-body = "1"
libc = "0.2.177"
path-absolutize = { workspace = true }
regress = "0.10"
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde = { workspace = true, features = ["derive"] }
tar = "0.4"
tabled = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
time = { workspace = true, features = ["formatting", "parsing"] }
url = { workspace = true }
webbrowser = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
webpki-roots = "1"
onequery-cli-core = { workspace = true }
onequery-config = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true }

[build-dependencies]
buffa = { version = "0.3.0", features = ["json"] }
buffa-codegen = "0.3.0"
connectrpc-codegen = "0.3.2"

[lints]
workspace = true
