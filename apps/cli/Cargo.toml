[workspace]
members = [
  "crates/async-utils",
  "crates/config",
  "crates/connect-support",
  "crates/core",
  "crates/core/tests/common",
  "crates/gateway",
  "crates/git-utils",
  "crates/install-context",
  "crates/onequery-cli",
  "crates/process-hardening",
  "crates/proto-cli",
  "crates/proto-runtime",
  "crates/source-connect-cli",
  "crates/utils",
  "crates/utils/absolute-path",
  "crates/utils/cargo-bin",
  "crates/utils/elapsed",
  "crates/utils/home-dir",
  "crates/utils/path-utils",
  "crates/utils/readiness",
  "crates/utils/string",
  "crates/utils/template",
]
resolver = "2"

[workspace.package]
version = "0.1.59"
# COMMENT: Keep the checked-in Rust workspace version at 0.0.0 on origin/main
# and normal development branches. Only temporary release/* branches should
# carry the real release version so Cargo embeds it and the release workflow
# can validate tag parity before that branch/PR is removed.
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal
onequery-async-utils = { path = "crates/async-utils" }
onequery-cli = { path = "crates/onequery-cli" }
onequery-core = { path = "crates/core" }
onequery-core-test-support = { path = "crates/core/tests/common" }
onequery-config = { path = "crates/config" }
onequery-connect-support = { path = "crates/connect-support" }
onequery-gateway = { path = "crates/gateway" }
onequery-git-utils = { path = "crates/git-utils" }
onequery-install-context = { path = "crates/install-context" }
onequery-process-hardening = { path = "crates/process-hardening" }
onequery-proto-cli = { path = "crates/proto-cli" }
onequery-proto-runtime = { path = "crates/proto-runtime" }
onequery-source-connect-cli = { path = "crates/source-connect-cli" }
onequery-utils = { path = "crates/utils" }
onequery-utils-absolute-path = { path = "crates/utils/absolute-path" }
onequery-utils-cargo-bin = { path = "crates/utils/cargo-bin" }
onequery-utils-elapsed = { path = "crates/utils/elapsed" }
onequery-utils-home-dir = { path = "crates/utils/home-dir" }
onequery-utils-path = { path = "crates/utils/path-utils" }
onequery-utils-readiness = { path = "crates/utils/readiness" }
onequery-utils-string = { path = "crates/utils/string" }
onequery-utils-template = { path = "crates/utils/template" }

# External
assert_cmd = "2"
assert_matches = "1.5.0"
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.22"
blake3 = "1"
buffa = "0.3.0"
buffa-types = "0.3.0"
chrono = "0.4"
clap = "4"
connectrpc = { version = "0.3.3", default-features = false }
dirs = "6"
dunce = "1.0.4"
flate2 = "1.1.9"
futures = "0.3"
getrandom = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
insta = "1.47.2"
jaq-core = "3.0.0"
jaq-json = "2.0.0"
jaq-std = "3.0.0"
libc = "0.2.185"
pretty_assertions = "1.4.1"
predicates = "3"
proptest = "1.11.0"
regress = "0.11"
regex-lite = "0.1.8"
schemars = "0.8.22"
serde = "1"
serde_path_to_error = "0.1"
serde_json = "1"
serial_test = "3.2.0"
shlex = "1.3.0"
tabled = "0.20"
tar = "0.4"
tempfile = "3"
test-case = "3.3.1"
test-log = "0.2.19"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-test = "0.4"
tokio-util = "0.7.18"
toml = "1"
toml_edit = "0.25"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-test = "0.2.5"
ts-rs = "11"
ureq = { version = "3", default-features = false }
url = "2"
uuid = "1"
webbrowser = "1"
webpki-roots = "1"
windows-sys = "0.61.2"
wiremock = "0.6"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.ci-test]
debug = 1 # Reduce debug symbol size
inherits = "test"
opt-level = 0
