[workspace]
members = [
  "crates/onequery-cli",
  "crates/onequery-cli-core",
  "crates/onequery-config",
]
resolver = "2"

[workspace.package]
version = "0.1.39"
# COMMENT: Keep the checked-in Rust workspace version at 0.0.0 on origin/main
# and normal development branches. Only temporary release/* branches should
# carry the real release version so Cargo embeds it and the release workflow
# can validate tag parity before that branch/PR is removed.
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal
onequery-cli = { path = "crates/onequery-cli" }
onequery-cli-core = { path = "crates/onequery-cli-core" }
onequery-config = { path = "crates/onequery-config" }

# External
base64 = "0.22"
blake3 = "1"
buffa = "0.3.0"
buffa-codegen = "0.3.0"
buffa-types = "0.3.0"
chrono = "0.4"
clap = "4"
connectrpc = "0.3.2"
connectrpc-codegen = "0.3.2"
dirs = "6"
flate2 = "1.1.9"
getrandom = "0.4"
http = "1"
http-body = "1"
insta = "1.47.2"
jaq-core = "3.0.0"
jaq-json = "2.0.0"
jaq-std = "3.0.0"
libc = "0.2.185"
pretty_assertions = "1.4.1"
path-absolutize = "3"
regress = "0.11"
serde = "1"
serde_path_to_error = "0.1"
serde_json = "1"
tabled = "0.20"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", default-features = false }
url = "2"
uuid = "1"
webbrowser = "1"
webpki-roots = "1"
windows-sys = "0.61.2"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.ci-test]
debug = 1 # Reduce debug symbol size
inherits = "test"
opt-level = 0
