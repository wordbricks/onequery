<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script type="module">
      import { badge, renderPage, row, section } from "./components.js";

      renderPage({
        title: "Pills & Badges",
        description:
          "Badges carry factual status only. Keep them small, literal, and close to the data they qualify.",
        sections: [
          section({
            title: "Badge variants",
            description: "Use semantic variants for lifecycle states and outline badges for policies or scope.",
            content: row([
              badge({ label: "primary", variant: "default" }),
              badge({ label: "read-only", variant: "outline" }),
              badge({ label: "connected", variant: "success", iconName: "check" }),
              badge({ label: "validating", variant: "warning" }),
              badge({ label: "blocked", variant: "error", iconName: "x" }),
              badge({ label: "cost limit $5", variant: "secondary" }),
              badge({ label: "agent approved", variant: "outline", iconName: "shield" }),
            ]),
          }),
        ],
      });
    </script>
  </body>
</html>
