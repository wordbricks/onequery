pre-commit:
  commands:
    lint:
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs}"
        - "*.{json,jsonc,json5}"
        - "*.{yaml,yml,toml}"
        # - "*.{md,mdx}"
        - "*.{css,scss,less}"
        - "*.{html,gql,graphql,hbs}"
      stage_fixed: true
    format:
      run: bunx oxfmt {staged_files}
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs}"
        - "*.{json,jsonc,json5}"
        - "*.{yaml,yml,toml}"
        # - "*.{md,mdx}"
        - "*.{css,scss,less}"
        - "*.{html,gql,graphql,hbs}"
      stage_fixed: true

pre-push:
  commands:
    lint-full:
      run: bunx turbo lint --json -- --type-aware --type-check
