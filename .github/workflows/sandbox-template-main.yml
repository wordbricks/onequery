name: Build Agent Sandbox Template

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-agent-sandbox-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.detect.outputs.should-build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        name: Detect changed paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA='${{ github.event.before }}'
          HEAD_SHA='${{ github.sha }}'
          echo "Before SHA: $BEFORE_SHA"
          echo "Head SHA: $HEAD_SHA"
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            files=('packages/sandbox-runtime/force')
          else
            mapfile -t files < <(git diff --name-only --no-renames "$BEFORE_SHA" "$HEAD_SHA")
          fi

          should_build=false
          for f in "${files[@]}"; do
            case "$f" in
              apps/web/src/server/agent/*|packages/sandbox-runtime/*|packages/server/src/*|packages/db/src/*)
                should_build=true
                break
                ;;
            esac
          done

          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"

  build-agent-sandbox-template:
    needs: [check-paths]
    if: needs.check-paths.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun ci

      - name: Build production sandbox template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: cd packages/sandbox-runtime && NODE_ENV=production bun template:build

  skip-build-agent-sandbox-template:
    if: github.event_name == 'push' && needs.check-paths.outputs.should-build != 'true'
    needs: [check-paths]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping template build - no relevant file changes"
