name: OpenClaw Plugin ClawHub Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/openclaw-plugin-clawhub-dry-run.yml"
      - "packages/openclaw-plugin/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.15.0
    with:
      dry_run: true
      owner: onequery
      source_path: packages/openclaw-plugin
