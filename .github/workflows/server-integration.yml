name: Server Integration

on:
  workflow_dispatch:

concurrency:
  group: server-integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  server-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      ONEQUERY_PGLITE_DIR: /tmp/onequery-server-integration/pglite/onequery

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun ci

      - name: Prepare PGlite database directory
        run: mkdir -p "$ONEQUERY_PGLITE_DIR"

      - name: Apply PGlite test database schema
        run: cd packages/db && bunx drizzle-kit push --force --config drizzle.config.ts

      - name: Test integration
        run: bunx turbo run test:integration --filter='@onequery/server'
