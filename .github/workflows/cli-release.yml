name: CLI Release

on:
  push:
    tags:
      - "cli-v*.*.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tag-check:
    runs-on: ubuntu-latest
    outputs:
      publish_tag: ${{ steps.validate.outputs.publish_tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag matches CLI release version
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Tag validation"

          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "❌  Not a tag push"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "❌  Tag '${GITHUB_REF_NAME}' does not match cli-v<semver>"; exit 1; }
          version="${GITHUB_REF_NAME#cli-v}"
          cargo_version="$(grep -A5 '^\[workspace\.package\]' apps/cli/Cargo.toml | grep -m1 '^version' | sed -E 's/version *= *\"([^\"]+)\".*/\1/')"

          [[ "${version}" == "${cargo_version}" ]] \
            || { echo "❌  Tag ${version} ≠ Cargo.toml ${cargo_version}"; exit 1; }

          # COMMENT: Match Codex's release shape: normal development commits
          # can keep a placeholder Rust version, but the tagged release commit
          # must carry the real version and agree with the release tag.
          echo "✅  Tag and Cargo.toml agree (${version})"

          publish_tag="latest"
          if [[ "${version}" == *"-alpha."* ]]; then
            publish_tag="alpha"
          elif [[ "${version}" == *"-beta."* ]]; then
            publish_tag="beta"
          elif [[ "${version}" == *"-"* ]]; then
            publish_tag="next"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish_tag=${publish_tag}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  build-unix:
    needs: tag-check
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # COMMENT: Keep GNU targets in the release matrix for parity with the
          # Codex release flow, but Linux npm packages still publish musl
          # payloads so installs keep the current broad compatibility shape.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # COMMENT: Keep the current macOS runner classes for OneQuery. Unlike
          # Codex, this CLI only builds one binary per macOS target and does
          # not need the larger xlarge runner shape.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: apps/cli
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          # COMMENT: setup-bun only installs the Bun runtime. The self-host
          # executable build compiles packages/bun-server and must resolve the
          # workspace graph from bun.lock first.
          bun ci

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' }}
        name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' }}
        name: Install musl build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' }}
        name: Configure aws-lc musl env
        shell: bash
        run: |
          set -euo pipefail
          # CONTEXT: OneQuery also pulls in aws-lc via rustls; match Codex's
          # musl workaround to avoid the problematic jitter entropy path.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Build CLI binary
        run: |
          # COMMENT: Keep the musl path on plain cargo so target installation,
          # linker wiring, and C toolchain setup are visible in workflow logs.
          cargo build --locked --release --bin onequery --target ${{ matrix.target }}

      - name: Build self-host server executable
        run: |
          set -euo pipefail
          bun scripts/build-server-executable.js --target-triple "${{ matrix.target }}"

      - name: Stage vendor payload
        run: |
          set -euo pipefail

          mkdir -p "dist/vendor/${{ matrix.target }}/onequery"
          cp "target/${{ matrix.target }}/release/onequery" "dist/vendor/${{ matrix.target }}/onequery/onequery"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-npm-vendor-${{ matrix.target }}
          path: apps/cli/dist/vendor
          if-no-files-found: error

  build-windows-binaries:
    needs: tag-check
    name: Build Windows binaries - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # COMMENT: We do not maintain dedicated Windows builders, so keep the
          # Windows release path on standard GitHub-hosted runner images.
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: primary
            runs_on: windows-2025
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: primary
            runs_on: windows-11-arm
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: helpers
            runs_on: windows-2025
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: helpers
            runs_on: windows-11-arm
    defaults:
      run:
        working-directory: apps/cli
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          # COMMENT: The Rust CLI build.rs shells out to the workspace Buf
          # binary under node_modules/.bin, so Windows primary bundles need
          # the same Bun dependency install as the helper bundles.
          bun ci

      - uses: dtolnay/rust-toolchain@1.93.0
        if: ${{ matrix.bundle == 'primary' }}
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build (Windows binaries)
        if: ${{ matrix.bundle == 'primary' }}
        run: cargo build --locked --release --bin onequery --target ${{ matrix.target }}

      - name: Verify Windows CLI binary
        if: ${{ matrix.bundle == 'primary' }}
        run: |
          & "target/${{ matrix.target }}/release/onequery.exe" --help | Out-Null

      - name: Build self-host server executable
        if: ${{ matrix.bundle == 'helpers' }}
        run: |
          bun scripts/build-server-executable.js --target-triple "${{ matrix.target }}"

      - name: Stage Windows binaries
        run: |
          $outputDir = "target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          if ("${{ matrix.bundle }}" -eq "primary") {
            Copy-Item "target/${{ matrix.target }}/release/onequery.exe" "$outputDir/onequery.exe"
          } else {
            Copy-Item "dist/vendor/${{ matrix.target }}/server/*" "$outputDir/"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: windows-binaries-${{ matrix.target }}-${{ matrix.bundle }}
          path: apps/cli/target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}/*
          if-no-files-found: error

  build-windows:
    needs: [tag-check, build-windows-binaries]
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            runs_on: windows-2025
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            runs_on: windows-11-arm
    defaults:
      run:
        working-directory: apps/cli
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Download prebuilt Windows primary binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries-${{ matrix.target }}-primary
          path: apps/cli/target/${{ matrix.target }}/release

      - name: Download prebuilt Windows helper binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries-${{ matrix.target }}-helpers
          path: apps/cli/target/${{ matrix.target }}/release

      - name: Verify Windows binaries
        run: |
          Get-Item "target/${{ matrix.target }}/release/onequery.exe" | Out-Null
          Get-Item "target/${{ matrix.target }}/release/onequery-server.exe" | Out-Null

      - name: Stage vendor payload
        run: |
          New-Item -ItemType Directory -Force -Path "dist/vendor/${{ matrix.target }}/onequery" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/vendor/${{ matrix.target }}/server" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/onequery.exe" "dist/vendor/${{ matrix.target }}/onequery/onequery.exe"
          Copy-Item "target/${{ matrix.target }}/release/onequery-server.exe" "dist/vendor/${{ matrix.target }}/server/onequery-server.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-npm-vendor-${{ matrix.target }}
          path: apps/cli/dist/vendor
          if-no-files-found: error

  release:
    needs: [tag-check, build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish_tag: ${{ needs.tag-check.outputs.publish_tag }}
      version: ${{ needs.tag-check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate release notes from tag commit message
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          # COMMENT: Match Codex's release flow. For annotated tags GITHUB_SHA
          # can point at the tag object, so peel to the tagged commit first.
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          notes_path="${RUNNER_TEMP}/release-notes.md"

          # COMMENT: Use the tagged commit message instead of the annotated tag
          # message so reruns stay deterministic.
          git log -1 --format=%B "${commit}" > "${notes_path}"
          echo >> "${notes_path}"

          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: |
          # COMMENT: npm staging builds apps/web and packages the Bun runtime,
          # so this release job also needs the workspace dependencies hydrated.
          bun ci

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-npm-vendor-*
          # upload-artifact stores the contents of apps/cli/dist/vendor, so
          # restore into dist/vendor to preserve the target directory layout.
          path: dist/vendor
          merge-multiple: true

      - name: Stage npm tarballs
        run: |
          bun apps/cli/scripts/stage-npm-packages.js \
            --package cli \
            --release-version "${{ needs.tag-check.outputs.version }}" \
            --vendor-src dist/vendor \
            --output-dir dist/npm-publish

      - name: Stage release-only tarballs
        run: |
          bun apps/cli/scripts/stage-npm-packages.js \
            --package cli-release-extras \
            --release-version "${{ needs.tag-check.outputs.version }}" \
            --vendor-src dist/vendor \
            --output-dir dist/release

      - name: Stage stable installer assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.tag-check.outputs.version }}"
          mkdir -p dist/npm-assets

          cp "dist/npm-publish/onequery-npm-${version}.tgz" "dist/npm-assets/onequery-npm.tgz"
          cp "dist/npm-publish/onequery-npm-darwin-arm64-${version}.tgz" "dist/npm-assets/onequery-npm-darwin-arm64.tgz"
          cp "dist/npm-publish/onequery-npm-darwin-x64-${version}.tgz" "dist/npm-assets/onequery-npm-darwin-x64.tgz"
          cp "dist/npm-publish/onequery-npm-linux-arm64-${version}.tgz" "dist/npm-assets/onequery-npm-linux-arm64.tgz"
          cp "dist/npm-publish/onequery-npm-linux-x64-${version}.tgz" "dist/npm-assets/onequery-npm-linux-x64.tgz"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-npm-publish-tarballs
          path: dist/npm-publish/*.tgz
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.tag-check.outputs.version }}
          IS_PRERELEASE: ${{ contains(needs.tag-check.outputs.version, '-') }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # COMMENT: Keep the release step rerunnable without depending on
          # softprops/action-gh-release, whose current v2 line still executes on
          # the deprecated Node 20 runtime.
          release_assets=(dist/npm-publish/*.tgz dist/npm-assets/*.tgz dist/release/*.tgz)
          [[ ${#release_assets[@]} -gt 0 ]] || {
            echo "No release assets were staged"
            exit 1
          }

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            edit_args=(gh release edit "${TAG_NAME}" --title "${VERSION}" --notes-file "${RELEASE_NOTES_PATH}")
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--latest)
            fi

            echo "+ ${edit_args[*]}"
            "${edit_args[@]}"

            upload_args=(gh release upload "${TAG_NAME}" "${release_assets[@]}" --clobber)
            echo "+ ${upload_args[*]}"
            "${upload_args[@]}"
            exit 0
          fi

          create_args=(gh release create "${TAG_NAME}" "${release_assets[@]}" --verify-tag --title "${VERSION}" --notes-file "${RELEASE_NOTES_PATH}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          else
            create_args+=(--latest)
          fi

          echo "+ ${create_args[*]}"
          "${create_args[@]}"

  publish-npm:
    needs: [tag-check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_TAG: ${{ needs.tag-check.outputs.publish_tag }}
      VERSION: ${{ needs.tag-check.outputs.version }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          name: cli-npm-publish-tarballs
          path: dist/npm-publish

      - name: Publish tarballs to npm
        shell: bash
        run: |
          set -euo pipefail

          # COMMENT: npm provenance currently rejects publishes sourced from private GitHub repositories.
          publish_args=(--access public)
          if [[ "${REPOSITORY_PRIVATE}" != "true" ]]; then
            publish_args=(--provenance --access public)
          fi

          root_tarball="dist/npm-publish/onequery-npm-${VERSION}.tgz"
          [[ -f "${root_tarball}" ]] || {
            echo "Missing root tarball ${root_tarball}"
            exit 1
          }

          mapfile -t platform_tarballs < <(find dist/npm-publish -maxdepth 1 -type f -name "onequery-npm-*-${VERSION}.tgz" ! -name "$(basename "${root_tarball}")" | sort)

          for tarball in "${platform_tarballs[@]}"; do
            publish_cmd=(npm publish "${tarball}" "${publish_args[@]}")
            if [[ -n "${PUBLISH_TAG}" ]]; then
              publish_cmd+=(--tag "${PUBLISH_TAG}")
            fi

            echo "+ ${publish_cmd[*]}"
            set +e
            publish_output="$("${publish_cmd[@]}" 2>&1)"
            publish_status=$?
            set -e

            echo "${publish_output}"
            if [[ ${publish_status} -eq 0 ]]; then
              continue
            fi

            if grep -qiE "previously published|cannot publish over|version already exists" <<< "${publish_output}"; then
              echo "Skipping already-published package version for ${tarball}"
              continue
            fi

            exit "${publish_status}"
          done

          publish_cmd=(npm publish "${root_tarball}" "${publish_args[@]}")
          if [[ -n "${PUBLISH_TAG}" ]]; then
            publish_cmd+=(--tag "${PUBLISH_TAG}")
          fi

          echo "+ ${publish_cmd[*]}"
          "${publish_cmd[@]}"
